<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue de Tests</title>
  <link rel="stylesheet" href="assets/css/app.css">

<script src="assets/js/config.js"></script>
<script src="assets/js/crypto-utils.js"></script>
<script src="assets/js/github-api.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/permissions.js"></script>
<script>
  /* Auth guard - bloque le rendu si non connecte. */
  if (!window.QASession.requireAuth()) {
    document.documentElement.style.display = 'none';
  }
</script>
</head>
<body>

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <svg class="memphis-deco memphis-deco-1" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="80" cy="40" r="32" fill="var(--memphis-1)"/>
      <circle cx="40" cy="80" r="6" fill="var(--memphis-3)"/>
      <circle cx="60" cy="100" r="3" fill="var(--memphis-2)"/>
    </svg>
    <svg class="memphis-deco memphis-deco-2" width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M10,50 Q25,20 50,50 T90,50" stroke="var(--memphis-4)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="70" y="70" width="14" height="14" fill="var(--memphis-2)" transform="rotate(15 77 77)"/>
    </svg>

    <div class="logo">
      <span class="logo-mark">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l3 3 7-7"/>
          <path d="M3 13l3 3"/>
        </svg>
      </span>
      <span>Catalogue de Tests</span>
    </div>

    <div class="session-bar" id="session-bar"></div>
    <a href="admin.html" class="admin-link" id="admin-link" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
      <span>Administration</span>
    </a>
    <div id="sync-indicator" class="sync-indicator" style="display:none;"></div>
    <button id="btn-refresh-github" class="admin-link" style="cursor:pointer;width:100%;justify-content:center;border:1px solid var(--border);" title="Recharger les donnees depuis GitHub (force un fetch sans cache)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span>Recharger</span>
    </button>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <div id="file-sync-section" style="margin-bottom:12px;display:none;"></div>
      <div style="display:flex;gap:6px;margin-bottom:14px;" id="sb-export-import-row">
        <button class="btn btn-sm" id="sb-export" data-perm="export:read" data-tip="Télécharger une sauvegarde JSON ponctuelle" style="flex:1;">Export</button>
        <button class="btn btn-sm" id="sb-import" data-perm="export:update" data-tip="Restaurer depuis un fichier JSON" style="flex:1;">Import</button>
        <input type="file" id="sb-import-file" accept=".json" style="display:none;">
      </div>
      <div>Stockage</div>
      <div class="storage-bar"><div id="storage-fill" style="width:0%"></div></div>
      <div id="storage-text" style="margin-top:4px;">—</div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main>
    <section id="view-dashboard" class="tab-view"></section>
    <section id="view-projects" class="tab-view"></section>
    <section id="view-testers" class="tab-view"></section>
    <section id="view-data" class="tab-view"></section>
    <section id="view-environments" class="tab-view"></section>
    <section id="view-blocks" class="tab-view"></section>
    <section id="view-testcases" class="tab-view"></section>
    <section id="view-testsuites" class="tab-view"></section>
    <section id="view-testplans" class="tab-view"></section>
    <section id="view-anomalies" class="tab-view"></section>
    <section id="view-reportbuilder" class="tab-view"></section>
    <section id="view-export" class="tab-view"></section>
  </main>
</div>

<!-- ===== Modals ===== -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modal-title">—</h2>
      <button class="btn-icon btn-ghost" data-close-modal aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="modal-image-viewer" id="image-viewer">
  <img id="image-viewer-img" src="" alt="">
</div>

<div class="toast" id="toast"></div>

  <script src="assets/js/app/data-model.js"></script>
  <script src="assets/js/app/helpers.js"></script>
  <script src="assets/js/app/persistence.js"></script>
  <script src="assets/js/app/renderers.js"></script>
  <script src="assets/js/app/reports-export.js"></script>
  <script src="assets/js/app/free-report.js"></script>
  <script src="assets/js/app/ui-nav.js"></script>
  <script src="assets/js/app/main.js"></script>
</body>
</html>
