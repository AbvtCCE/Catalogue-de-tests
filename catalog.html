  html += '<div class="summary" id="ck-summary">…</div>';
  html += '<button id="ck-expand-all">Tout déplier</button>';
  html += '<button id="ck-collapse-all">Tout replier</button>';
  html += '</div>';

  DATA.cases.forEach(function (c, ci) {
    const cs = getCaseState(c.id);
    let stepsHtml = "";
    c.steps.forEach(function (s, si) {
      const ss = getStepState(c.id, si);
      const remEmpty = !ss.remarks;
      const remOpen = ss.remarks ? ' open' : '';
      const shots = ss.screenshots || [];
      stepsHtml += '<li class="step-item"><div class="step-row">';
      stepsHtml += '<input type="checkbox" class="step-check" data-step="' + ci + ":" + si + '"' + (ss.done ? " checked" : "") + ">";
      stepsHtml += '<div class="step-content">';
      stepsHtml += '<div class="step-num">Étape ' + (si + 1);
      if (s.fromBlock) {
        const blockLbl = s.fromBlock.missing ? '(bloc supprimé)' : s.fromBlock.name;
        stepsHtml += ' <span class="step-block-tag" title="Étape issue d’un bloc réutilisable">via Bloc « ' + esc(blockLbl) + ' »</span>';
      }
      stepsHtml += "</div>";
      if (s.action) stepsHtml += '<div class="row"><strong>Action :</strong> ' + renderTextWithPills(s.action) + "</div>";
      if (s.expected) stepsHtml += '<div class="row"><strong>Résultat attendu :</strong> ' + renderTextWithPills(s.expected) + "</div>";

      // Compact tools row: remarks button + (if requested) screenshots button
      stepsHtml += '<div class="step-tools">';
      stepsHtml += '<button type="button" class="step-tool-btn' + (ss.remarks ? ' has-content' : '') + '" data-toggle-remarks="' + ci + ':' + si + '">Remarque' + (ss.remarks ? '' : '…') + '</button>';
      if (s.requiresScreenshot) {
        const shotsCls = shots.length > 0 ? ' has-content' : ' missing-shot';
        stepsHtml += '<button type="button" class="step-tool-btn' + shotsCls + '" data-toggle-shots="' + ci + ':' + si + '">Captures' + (shots.length > 0 ? ' (' + shots.length + ')' : ' requises') + '</button>';
      }
      stepsHtml += '</div>';

      // Remarks panel (hidden until toggled)
      stepsHtml += '<div class="step-extra' + remOpen + (remEmpty ? ' is-empty' : '') + '" data-extra-remarks="' + ci + ':' + si + '">';
      stepsHtml += '<textarea data-remarks="' + ci + ':' + si + '" rows="2" placeholder="Remarque pour cette étape">' + esc(ss.remarks) + "</textarea>";
      stepsHtml += '<div class="display-only display-text' + (remEmpty ? " empty" : "") + '">' + (remEmpty ? "(aucune remarque)" : esc(ss.remarks)) + "</div>";
      stepsHtml += "</div>";

      // Screenshots panel (hidden until toggled, multi-images)
      if (s.requiresScreenshot) {
        const shotsOpen = shots.length > 0 ? ' open' : '';
        stepsHtml += '<div class="step-extra' + shotsOpen + '" data-extra-shots="' + ci + ':' + si + '">';
        stepsHtml += '<input type="file" accept="image/*" multiple data-screenshot="' + ci + ":" + si + '">';
        stepsHtml += '<div class="shot-grid" data-shot-grid="' + ci + ':' + si + '">';
        shots.forEach(function (src, idx) {
          stepsHtml += '<div class="shot-tile"><img src="' + src + '" alt="" data-shot-zoom="' + ci + ':' + si + ':' + idx + '"><button type="button" class="shot-rm" data-shot-rm="' + ci + ':' + si + ':' + idx + '" title="Retirer">×</button></div>';
        });
        stepsHtml += '</div></div>';
      }

      stepsHtml += "</div></div></li>";
    });

    const cDone = c.steps.filter(function (_, si) { return getStepState(c.id, si).done; }).length;
    const isComplete = cDone === c.steps.length && c.steps.length > 0;
    const collapsedCls = cs.collapsed ? ' collapsed' : '';
    const failedCls = cs.outcome === 'fail' ? ' has-failed' : '';
    let statusCls = '';
    let statusTxt = cDone + ' / ' + c.steps.length;
    if (cs.outcome === 'fail') { statusCls = ' failed'; statusTxt = '✗ ' + statusTxt; }
    else if (cs.outcome === 'pass' || isComplete) { statusCls = ' complete'; statusTxt = '✓ ' + statusTxt; }

    html += '<article class="case-card' + collapsedCls + failedCls + '" data-card="' + c.id + '">';
    html += '<div class="case-head" data-toggle-card="' + c.id + '">';
    html += '<div class="case-head-left">';
    html += '<svg class="case-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '<h2 class="case-title">' + (ci + 1) + ". " + esc(c.title) + "</h2>";
    html += '</div>';
    html += '<span class="case-status' + statusCls + '" data-case-status="' + c.id + '">' + statusTxt + "</span>";
    html += "</div>";

    html += '<div class="case-body">';
    if (c.environments.length || c.types.length || c.isInterface) {
      html += '<div class="case-badges">';
      c.environments.forEach(function (e) { html += '<span class="badge badge-primary">' + esc(e) + "</span>"; });
      if (c.isInterface) html += '<span class="badge badge-accent">Interface</span>';
      c.types.forEach(function (t) { html += '<span class="badge">' + esc(t) + "</span>"; });
      html += "</div>";
    }

    if (c.jiraTickets && c.jiraTickets.length > 0) {
      html += '<div class="jira-strip">';
      html += '<span class="jira-strip-label">Jira :</span>';
      c.jiraTickets.forEach(function (t) {
        var label = esc(t.key) + (t.summary ? ' — ' + esc(t.summary) : '');
        if (t.url) {
          html += '<a class="jira-pill" href="' + esc(t.url) + '" target="_blank" rel="noopener">' + label + '</a>';
        } else {
          html += '<span class="jira-pill">' + label + '</span>';
        }
      });
      html += "</div>";
    }

    if (c.steps.length === 0) {
      html += '<div style="color:var(--text-muted);font-size:12px;font-style:italic;padding:4px 0;">Aucune étape définie.</div>';
    } else {
      html += '<ul class="step-list">' + stepsHtml + "</ul>";
    }

    // Outcome buttons + remarks toggle
    html += '<div class="case-outcome">';
    html += '<span class="lbl">Résultat :</span>';
    html += '<button type="button" class="outcome-btn pass' + (cs.outcome === 'pass' ? ' active' : '') + '" data-outcome="' + c.id + ':pass">✓ Réussi</button>';
    html += '<button type="button" class="outcome-btn fail' + (cs.outcome === 'fail' ? ' active' : '') + '" data-outcome="' + c.id + ':fail">✗ Échec</button>';
    html += '</div>';

    const cremEmpty = !cs.remarks;
    const cremOpen = cs.remarks ? ' open' : '';
    html += '<div class="case-remarks-toggle">';
    html += '<button type="button" class="step-tool-btn' + (cs.remarks ? ' has-content' : '') + '" data-toggle-case-remarks="' + c.id + '">Remarque sur le cas' + (cs.remarks ? '' : '…') + '</button>';
    html += '</div>';
    html += '<div class="case-remarks' + cremOpen + (cremEmpty ? ' is-empty' : '') + '" data-case-remarks-panel="' + c.id + '">';
    html += '<textarea data-case-remarks="' + c.id + '" rows="2" placeholder="Remarque générale">' + esc(cs.remarks) + "</textarea>";
    html += '<div class="display-only display-text' + (cremEmpty ? " empty" : "") + '">' + (cremEmpty ? "(aucune remarque)" : esc(cs.remarks)) + "</div>";
    html += "</div>";

    html += "</div>";
    html += "</article>";
  });
  list.innerHTML = html;
  bind();
  updateProgress();
  renderReportSummary();
  updateReportButtonState();
}

function bind() {
  document.querySelectorAll("[data-step]").forEach(function (cb) {
    cb.onchange = function () {
      const parts = cb.dataset.step.split(":");
      const ci = parseInt(parts[0], 10);
      const si = parseInt(parts[1], 10);
      const cid = DATA.cases[ci].id;
      getStepState(cid, si).done = cb.checked;
      persist();
      updateProgress();
      renderReportSummary();
    };
  });
  document.querySelectorAll("[data-remarks]").forEach(function (ta) {
    ta.oninput = function () {
      const parts = ta.dataset.remarks.split(":");
      const ci = parseInt(parts[0], 10);
      const si = parseInt(parts[1], 10);
      const cid = DATA.cases[ci].id;
      getStepState(cid, si).remarks = ta.value;
      persist();
      const display = ta.parentElement.querySelector(".display-text");
      if (display) {
        const empty = !ta.value;
        display.textContent = empty ? "(aucune remarque)" : ta.value;
        display.classList.toggle("empty", empty);
      }
      // Toggle is-empty on the panel so report mode hides it
      ta.parentElement.classList.toggle("is-empty", !ta.value);
      // Reflect on the toggle button state
      const btn = document.querySelector('[data-toggle-remarks="' + ci + ':' + si + '"]');
      if (btn) {
        btn.classList.toggle('has-content', !!ta.value);
        btn.textContent = ta.value ? 'Remarque' : 'Remarque…';
      }
    };
  });
  document.querySelectorAll("[data-case-remarks]").forEach(function (ta) {
    ta.oninput = function () {
      const cid = ta.dataset.caseRemarks;
      getCaseState(cid).remarks = ta.value;
      persist();
      const display = ta.parentElement.querySelector(".display-text");
      if (display) {
        const empty = !ta.value;
        display.textContent = empty ? "(aucune remarque)" : ta.value;
        display.classList.toggle("empty", empty);
      }
      ta.parentElement.classList.toggle("is-empty", !ta.value);
      const btn = document.querySelector('[data-toggle-case-remarks="' + cid + '"]');
      if (btn) {
        btn.classList.toggle('has-content', !!ta.value);
        btn.textContent = ta.value ? 'Remarque sur le cas' : 'Remarque sur le cas…';
      }
    };
  });
  // Multi-screenshot upload
  document.querySelectorAll("[data-screenshot]").forEach(function (input) {
    input.onchange = async function () {
      const files = Array.from(input.files || []);
      if (files.length === 0) return;
      const parts = input.dataset.screenshot.split(":");
      const ci = parseInt(parts[0], 10);
      const si = parseInt(parts[1], 10);
      const cid = DATA.cases[ci].id;
      const ss = getStepState(cid, si);
      for (const f of files) {
        try {
          const dataUrl = await compressImage(f);
          ss.screenshots.push(dataUrl);
        } catch (e) {
          alert("Image illisible : " + (f.name || ""));
        }
      }
      persist();
      input.value = "";
      // Re-render just this step's grid
      refreshStepShots(ci, si);
    };
  });
  // Remove screenshot
  document.querySelectorAll("[data-shot-rm]").forEach(function (btn) {
    btn.onclick = function (ev) {
      ev.stopPropagation();
      const parts = btn.dataset.shotRm.split(":");
      const ci = parseInt(parts[0], 10);
      const si = parseInt(parts[1], 10);
      const idx = parseInt(parts[2], 10);
      const cid = DATA.cases[ci].id;
      const ss = getStepState(cid, si);
      ss.screenshots.splice(idx, 1);
      persist();
      refreshStepShots(ci, si);
    };
  });
  // Zoom screenshot
  document.querySelectorAll("[data-shot-zoom]").forEach(function (img) {
    img.onclick = function () {
      if (document.getElementById("ck-root").classList.contains("report-mode")) return;
      const parts = img.dataset.shotZoom.split(":");
      const ci = parseInt(parts[0], 10);
      const si = parseInt(parts[1], 10);
      const idx = parseInt(parts[2], 10);
      const cid = DATA.cases[ci].id;
      const src = getStepState(cid, si).screenshots[idx];
      showShotZoom(src);
    };
  });
  // Step extras toggles
  document.querySelectorAll("[data-toggle-remarks]").forEach(function (btn) {
    btn.onclick = function () {
      const sel = '[data-extra-remarks="' + btn.dataset.toggleRemarks + '"]';
      const panel = document.querySelector(sel);
      if (panel) {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) {
          const ta = panel.querySelector("textarea");
          if (ta) ta.focus();
        }
      }
    };
  });
  document.querySelectorAll("[data-toggle-shots]").forEach(function (btn) {
    btn.onclick = function () {
      const sel = '[data-extra-shots="' + btn.dataset.toggleShots + '"]';
      const panel = document.querySelector(sel);
      if (panel) panel.classList.toggle("open");
    };
  });
  document.querySelectorAll("[data-toggle-case-remarks]").forEach(function (btn) {
    btn.onclick = function () {
      const sel = '[data-case-remarks-panel="' + btn.dataset.toggleCaseRemarks + '"]';
      const panel = document.querySelector(sel);
      if (panel) {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) {
          const ta = panel.querySelector("textarea");
          if (ta) ta.focus();
        }
      }
    };
  });
  // Card collapse / expand
  document.querySelectorAll("[data-toggle-card]").forEach(function (head) {
    head.onclick = function (ev) {
      // Don't collapse if click was on an interactive child (Jira link, status badge content)
      if (ev.target.closest('a')) return;
      const cid = head.dataset.toggleCard;
      const card = document.querySelector('[data-card="' + cid + '"]');
      if (!card) return;
      card.classList.toggle("collapsed");
      getCaseState(cid).collapsed = card.classList.contains("collapsed");
      persist();
    };
  });
  const expandAll = document.getElementById("ck-expand-all");
  if (expandAll) expandAll.onclick = function () {
    DATA.cases.forEach(function (c) { getCaseState(c.id).collapsed = false; });
    persist();
    document.querySelectorAll(".case-card").forEach(function (el) { el.classList.remove("collapsed"); });
  };
  const collapseAll = document.getElementById("ck-collapse-all");
  if (collapseAll) collapseAll.onclick = function () {
    DATA.cases.forEach(function (c) { getCaseState(c.id).collapsed = true; });
    persist();
    document.querySelectorAll(".case-card").forEach(function (el) { el.classList.add("collapsed"); });
  };
  // Outcome buttons
  document.querySelectorAll("[data-outcome]").forEach(function (btn) {
    btn.onclick = function () {
      const parts = btn.dataset.outcome.split(":");
      const cid = parts[0];
      const outcome = parts[1];
      const cs = getCaseState(cid);
      cs.outcome = (cs.outcome === outcome) ? null : outcome;
      persist();
      // Update buttons + status pill + card class
      const card = document.querySelector('[data-card="' + cid + '"]');
      if (card) {
        card.classList.toggle('has-failed', cs.outcome === 'fail');
        card.querySelectorAll('[data-outcome]').forEach(function (b) {
          const o = b.dataset.outcome.split(":")[1];
          b.classList.toggle('active', cs.outcome === o);
        });
      }
      updateProgress();
      renderReportSummary();
    };
  });
}

function refreshStepShots(ci, si) {
  const cid = DATA.cases[ci].id;
  const ss = getStepState(cid, si);
  const grid = document.querySelector('[data-shot-grid="' + ci + ':' + si + '"]');
  if (grid) {
    grid.innerHTML = ss.screenshots.map(function (src, idx) {
      return '<div class="shot-tile"><img src="' + src + '" alt="" data-shot-zoom="' + ci + ':' + si + ':' + idx + '"><button type="button" class="shot-rm" data-shot-rm="' + ci + ':' + si + ':' + idx + '" title="Retirer">×</button></div>';
    }).join('');
    // Re-bind the new tiles
    grid.querySelectorAll('[data-shot-rm]').forEach(function (btn) {
      btn.onclick = function (ev) {
        ev.stopPropagation();
        const p = btn.dataset.shotRm.split(":");
        const ci2 = parseInt(p[0], 10), si2 = parseInt(p[1], 10), idx2 = parseInt(p[2], 10);
        const cid2 = DATA.cases[ci2].id;
        getStepState(cid2, si2).screenshots.splice(idx2, 1);
        persist();
        refreshStepShots(ci2, si2);
      };
    });
    grid.querySelectorAll('[data-shot-zoom]').forEach(function (img) {
      img.onclick = function () {
        if (document.getElementById("ck-root").classList.contains("report-mode")) return;
        const p = img.dataset.shotZoom.split(":");
        const ci2 = parseInt(p[0], 10), si2 = parseInt(p[1], 10), idx2 = parseInt(p[2], 10);
        const cid2 = DATA.cases[ci2].id;
        showShotZoom(getStepState(cid2, si2).screenshots[idx2]);
      };
    });
  }
  // Update the toggle button label and class
  const btn = document.querySelector('[data-toggle-shots="' + ci + ':' + si + '"]');
  if (btn) {
    const has = ss.screenshots.length > 0;
    btn.classList.toggle('has-content', has);
    btn.classList.toggle('missing-shot', !has);
    btn.textContent = has ? 'Captures (' + ss.screenshots.length + ')' : 'Captures requises';
  }
  updateReportButtonState();
}

/* Walks all cases/steps and counts those that require a screenshot but have none.
   Disables the report button while any are missing, and shows a tooltip explaining why. */
function countMissingShots() {
  let missing = 0;
  DATA.cases.forEach(function (c) {
    c.steps.forEach(function (s, si) {
      if (!s.requiresScreenshot) return;
      const ss = getStepState(c.id, si);
      if (!ss.screenshots || ss.screenshots.length === 0) missing++;
    });
  });
  return missing;
}

function updateReportButtonState() {
  const btn = document.getElementById("btn-report");
  if (!btn) return;
  const missing = countMissingShots();
  btn.disabled = missing > 0;
  if (missing > 0) {
    btn.title = missing + ' capture' + (missing > 1 ? 's' : '') + ' obligatoire' + (missing > 1 ? 's' : '') + ' manquante' + (missing > 1 ? 's' : '');
  } else {
    btn.title = '';
  }
}

function showShotZoom(src) {
  let bd = document.getElementById("shot-zoom-bd");
  if (!bd) {
    bd = document.createElement("div");
    bd.id = "shot-zoom-bd";
    bd.className = "shot-zoom-backdrop";
    bd.innerHTML = '<img alt="">';
    bd.onclick = function () { bd.classList.remove("open"); };
    document.body.appendChild(bd);
  }
  bd.querySelector("img").src = src;
  bd.classList.add("open");
}

function renderReportSummary() {
  const root = document.getElementById("report-summary");
  if (!root) return;
  // Compute pass / fail / pending across all cases
  let pass = 0, fail = 0, pending = 0;
  DATA.cases.forEach(function (c) {
    const cs = getCaseState(c.id);
    if (cs.outcome === 'pass') pass++;
    else if (cs.outcome === 'fail') fail++;
    else pending++;
  });
  const total = DATA.cases.length;
  let html = '<h2>Résumé d’exécution</h2>';
  html += '<div class="summary-counts">';
  html += '<div class="summary-count pass"><span class="num">' + pass + '</span><span class="lbl">Réussis</span></div>';
  html += '<div class="summary-count fail"><span class="num">' + fail + '</span><span class="lbl">Échecs</span></div>';
  html += '<div class="summary-count todo"><span class="num">' + pending + '</span><span class="lbl">En attente</span></div>';
  html += '<div class="summary-count"><span class="num">' + total + '</span><span class="lbl">Total</span></div>';
  html += '</div>';
  // Hierarchy: structure (suites/groupes) → cases
  if (DATA.structure && DATA.structure.length > 0) {
    html += '<div class="summary-tree">';
    DATA.structure.forEach(function (group) {
      html += '<div class="summary-tree-section">';
      html += '<div class="summary-tree-title">' + esc(group.name) + '</div>';
      let gPass = 0, gFail = 0, gPending = 0;
      group.caseIds.forEach(function (cid) {
        const c = DATA.cases.find(function (x) { return x.id === cid; });
        if (!c) return;
        const cs = getCaseState(cid);
        let pillCls = 'pill-todo', pillTxt = 'En attente';
        if (cs.outcome === 'pass') { pillCls = 'pill-pass'; pillTxt = '✓ Réussi'; gPass++; }
        else if (cs.outcome === 'fail') { pillCls = 'pill-fail'; pillTxt = '✗ Échec'; gFail++; }
        else gPending++;
        html += '<div class="summary-tree-row">';
        html += '<span class="name">' + esc(c.title) + '</span>';
        html += '<span class="stats ' + pillCls + '">' + pillTxt + '</span>';
        html += '</div>';
      });
      // Group totals row
      html += '<div class="summary-tree-row" style="border-top:1px dashed var(--border);margin-top:4px;padding-top:4px;font-weight:500;">';

      if (gPending > 0) html += '<span class="pill-todo">' + gPending + ' …</span>';
      html += '</span></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  // Update toolbar summary

  if (tb) {
    tb.innerHTML = '<strong>' + pass + '</strong> réussis · <strong>' + fail + '</strong> échecs · <strong>' + pending + '</strong> en attente';
  }

}

function updateProgress() {
  let total = 0, done = 0;
  DATA.cases.forEach(function (c) {
    c.steps.forEach(function (_, si) {
      total++;
      if (getStepState(c.id, si).done) done++;
    });
    const cDone = c.steps.filter(function (_, si) { return getStepState(c.id, si).done; }).length;
    const isComplete = cDone === c.steps.length && c.steps.length > 0;
    const statusEl = document.querySelector('[data-case-status="' + c.id + '"]');
    if (statusEl) {
      statusEl.textContent = cDone + " / " + c.steps.length;
      statusEl.classList.toggle("complete", isComplete);
    }
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-text").textContent = done + " / " + total + " (" + pct + "%)";
}

function generateReport() {
  const missing = countMissingShots();
  if (missing > 0) {
    alert(missing + ' capture' + (missing > 1 ? 's' : '') + ' obligatoire' + (missing > 1 ? 's' : '') + ' manquante' + (missing > 1 ? 's' : '') + '. Ajoutez-les avant de générer le rapport.');
    return;
  }
  if (!progress.reportGeneratedAt) progress.reportGeneratedAt = new Date().toISOString();
  persist();
  document.getElementById("ck-root").classList.add("report-mode");
  document.getElementById("report-date").textContent = new Date(progress.reportGeneratedAt).toLocaleString("fr-CH");
  window.scrollTo(0, 0);
  setTimeout(function () { window.print(); }, 350);
}

function exitReport() {
  document.getElementById("ck-root").classList.remove("report-mode");
}

function clearAll() {
  if (!confirm("Réinitialiser toutes les saisies ? Cette action est irréversible.")) return;
  progress = { cases: {}, reportGeneratedAt: null };
  persist();
  renderCases();
}

document.getElementById("btn-report").onclick = generateReport;

<\/script>

/* =====================================================================
   PROJECTS — campagnes de tests avec dates effectives et plans liés
   ===================================================================== */
function projectStats(p) {
  const planSet = new Set(p.planIds || []);
  const linkedPlans = state.testPlans.filter(pl => planSet.has(pl.id));
  const allCaseIds = new Set();
  linkedPlans.forEach(pl => collectPlanCases(pl, true).forEach(c => allCaseIds.add(c.id)));
  const allCases = Array.from(allCaseIds).map(id => state.testCases.find(c => c.id === id)).filter(Boolean);
  const ready = allCases.filter(c => c.ready).length;
  const automated = allCases.filter(c => c.automated).length;
  const totalTime = allCases.reduce((acc, c) => acc + (Number(c.estimatedTime) || 0), 0);
  const pct = allCases.length > 0 ? Math.round((ready / allCases.length) * 100) : 0;

  // Anomalies linked through any of the project's cases
  const caseIdSet = new Set(allCases.map(c => c.id));
  const linkedAnomalies = (state.anomalies || []).filter(a =>
    (a.testCaseIds || []).some(id => caseIdSet.has(id))
  );
  const openAnomalies = linkedAnomalies.filter(anomalyIsOpen);
  const criticalOpenAnomalies = openAnomalies.filter(a => a.severity === 'critical');

  // Phase + urgency
  const base = { linkedPlans, allCases, ready, automated, totalTime, pct, linkedAnomalies, openAnomalies, criticalOpenAnomalies };
  if (!p.startDate || !p.endDate) {
    return { ...base, phase: 'undated', urgency: 'none' };
  }
  const todayStr = today();
  const totalDays = Math.max(1, daysBetween(p.startDate, p.endDate));
  const daysToStart = daysBetween(todayStr, p.startDate);   // positive = future
  const daysToEnd   = daysBetween(todayStr, p.endDate);
  const elapsedDays = -daysToStart;                          // positive once started
  const remainingDays = daysToEnd;

  let phase, urgency;
  if (daysToStart > 0) {
    phase = 'upcoming';
    if (daysToStart <= 7 && pct < 100) urgency = 'high';
    else if (daysToStart <= 14 && pct < 80) urgency = 'high';
    else if (daysToStart <= 30 && pct < 80) urgency = 'medium';
    else urgency = 'low';
  } else if (daysToEnd >= 0) {
    phase = 'active';
    if (remainingDays <= 3) urgency = 'high';
    else if (remainingDays <= 14) urgency = 'medium';
    else urgency = 'low';
  } else {
    phase = 'past';
    urgency = 'none';
  }
  const timePct = totalDays > 0 ? Math.max(0, Math.min(100, Math.round((elapsedDays / totalDays) * 100))) : 0;
  return {
    ...base, phase, urgency, totalDays, elapsedDays, remainingDays, daysToStart, daysToEnd, timePct,
  };
}

function projectStatusLabel(stats) {
  switch (stats.phase) {
    case 'undated':  return 'Sans dates';
    case 'upcoming': {
      const d = stats.daysToStart;
      if (d === 0) return 'Démarre aujourd\'hui';
      if (d === 1) return 'Démarre demain';
      return `Démarre dans ${d} jours`;
    }
    case 'active': {
      const d = stats.remainingDays;
      if (d === 0) return 'Termine aujourd\'hui';
      if (d === 1) return 'Termine demain';
      return `En cours · ${d} jours restants`;
    }
    case 'past': {
      const d = -stats.daysToEnd;
      if (d === 0) return 'Terminée aujourd\'hui';
      if (d === 1) return 'Terminée hier';
      return `Terminée il y a ${d} jours`;
    }
  }
}

function projectStatusBadgeClass(stats) {
  if (stats.urgency === 'high') return 'badge-danger';
  if (stats.urgency === 'medium') return 'badge-accent';
  if (stats.phase === 'active') return 'badge-success';
  if (stats.phase === 'upcoming') return 'badge-primary';
  return 'badge-muted';
}

function projectGap(stats) {
  // Preparation gap: how far behind/ahead readiness is vs time elapsed.
  // Only meaningful for active projects (campaign already started).
  if (stats.phase !== 'active') return null;
  return stats.pct - stats.timePct;
}

function renderProjects(view) {
  const projects = state.projects || [];
  const decorated = projects.map(p => ({ p, s: projectStats(p) }));
  // Sort: upcoming first by days asc, then active by remaining asc, then past
  const PHASE_ORDER = { upcoming: 0, active: 1, undated: 2, past: 3 };
  decorated.sort((a, b) => {
    const pa = PHASE_ORDER[a.s.phase], pb = PHASE_ORDER[b.s.phase];
    if (pa !== pb) return pa - pb;
    if (a.s.phase === 'upcoming') return a.s.daysToStart - b.s.daysToStart;
    if (a.s.phase === 'active')   return a.s.remainingDays - b.s.remainingDays;
    if (a.s.phase === 'past')     return a.s.daysToEnd - b.s.daysToEnd;
    return a.p.name.localeCompare(b.p.name);
  });

  view.innerHTML = `

/* =====================================================================
   TESTERS — niveaux d'expertise et testeurs disponibles
   ===================================================================== */
function levelById(id) {
  return (state.testerLevels || []).find(l => l.id === id) || null;
}

function levelOrder(id) {
  const l = levelById(id);
  return l ? l.order : 0;
}

function sortedLevels() {
  return [...(state.testerLevels || [])].sort((a, b) => a.order - b.order);
}

/* Cases that a tester at the given level can execute.
   Rule: tester.level >= case.minLevel. Case without minLevel = anyone. */
function casesAccessibleTo(tester, cases) {
  const lvlOrder = levelOrder(tester.levelId);
  return (cases || []).filter(c => {
    if (!c.minLevelId) return true;
    return lvlOrder >= levelOrder(c.minLevelId);
  });
}

/* Required-level breakdown for a list of cases — for resource planning.
   Returns: [{ level: levelObj|null, count, time, cases: [] }] sorted by order asc. */
function levelBreakdown(cases) {
  const groups = new Map(); // key = levelId or '__none'
  cases.forEach(c => {
    const key = c.minLevelId || '__none';
    if (!groups.has(key)) groups.set(key, { count: 0, time: 0, cases: [] });
    const g = groups.get(key);
    g.count++;
    g.time += Number(c.estimatedTime) || 0;
    g.cases.push(c);
  });
  const result = [];
  if (groups.has('__none')) {
    result.push({ level: null, ...groups.get('__none') });
  }
  sortedLevels().forEach(lvl => {
    if (groups.has(lvl.id)) {
      result.push({ level: lvl, ...groups.get(lvl.id) });
    }
  });
  return result;
}

function moveLevel(id, dir, view) {
  const sorted = sortedLevels();
  const idx = sorted.findIndex(l => l.id === id);
  if (idx < 0) return;
  const swapWith = idx + dir;
  if (swapWith < 0 || swapWith >= sorted.length) return;
  const a = sorted[idx], b = sorted[swapWith];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  save();
  renderTesters(view);
}

function renderDataTablesUsed(cases) {
  // Walk all expanded steps (block refs resolved), group referenced columnIds by tableId
  const refsByTable = new Map();
  (cases || []).forEach(c => {
    expandSteps(c.steps).forEach(s => {
      const refs = [
        ...extractVariables(s.action || ''),
        ...extractVariables(s.expected || '')
      ];
      refs.forEach(r => {
        if (!refsByTable.has(r.tableId)) refsByTable.set(r.tableId, new Set());
        refsByTable.get(r.tableId).add(r.columnId);
      });
    });
  });
  if (refsByTable.size === 0) return '';

  return `
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:6px;">${ICON.table} Données nécessaires</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${[...refsByTable].map(([tid, colIds]) => {
          const t = (state.dataTables || []).find(x => x.id === tid);
          if (!t) {
            return `<div style="font-size:12px;color:#8a3a2c;">
              <strong>Table supprimée</strong> · ${colIds.size} variable${colIds.size > 1 ? 's' : ''} référencée${colIds.size > 1 ? 's' : ''}
            </div>`;
          }
          // Resolve each used column id → name; mark unresolved as missing
          const usedCols = [...colIds].map(cid => {
            const col = (t.columns || []).find(c => c.id === cid);
            return col ? { name: col.name, missing: false } : { name: '?', missing: true };
          });
          const rowCount = (t.rows || []).length;
          return `
            <div style="font-size:12px;line-height:1.6;">
              <strong style="color:var(--text);">${escapeHtml(t.name)}</strong>
              <span style="color:var(--text-muted);"> · ${rowCount} ligne${rowCount > 1 ? 's' : ''}</span>
              <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;">
                ${usedCols.map(c => `<span class="var-pill ${c.missing ? 'missing' : ''}" style="font-size:11px;padding:0 6px;">${escapeHtml(c.name)}</span>`).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* =====================================================================
   DATA TABLES — variables réutilisables dans les étapes des cas de tests
   ===================================================================== */
function findColumn(tableId, columnId) {
  const table = (state.dataTables || []).find(t => t.id === tableId);
  if (!table) return null;
  const column = (table.columns || []).find(c => c.id === columnId);
  return column ? { table, column } : null;
}

/* Parse {{tableId.columnId}} placeholders from text */
function extractVariables(text) {
  const refs = [];
  if (!text) return refs;
  const re = /\{\{([^}.]+)\.([^}]+)\}\}/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    refs.push({ tableId: m[1], columnId: m[2] });
  }
  return refs;
}

/* Returns deduped Set of table IDs referenced by all given cases (across action+expected) */
function tablesUsedByCases(cases) {
  const ids = new Set();
  (cases || []).forEach(c => {
    expandSteps(c.steps).forEach(s => {
      extractVariables(s.action || '').forEach(v => ids.add(v.tableId));
      extractVariables(s.expected || '').forEach(v => ids.add(v.tableId));
    });
  });
  return ids;
}

/* Render text as HTML with var pills — used for read-only display (checklist, spec) */
function renderStepText(text) {
  if (!text) return '';
  const escaped = escapeHtml(text);
  return escaped.replace(/\{\{([^}.]+)\.([^}]+)\}\}/g, (m, tid, cid) => {
    const found = findColumn(tid, cid);
    if (!found) return `<span class="var-pill missing" title="Variable supprimée">?</span>`;
    return `<span class="var-pill" title="${escapeHtml(found.table.name + ' → ' + found.column.name)}">${escapeHtml(found.column.name)}</span>`;
  });
}

/* Render text as HTML for contenteditable (pills are atomic, contenteditable=false) */
function renderEditableContent(text) {
  if (!text) return '';
  const escaped = escapeHtml(text);
  return escaped
    .replace(/\{\{([^}.]+)\.([^}]+)\}\}/g, (m, tid, cid) => {
      const found = findColumn(tid, cid);
      const label = found ? found.column.name : '?';
      const tooltip = found ? `${found.table.name} → ${found.column.name}` : 'Variable supprimée';
      const cls = found ? 'var-pill' : 'var-pill missing';
      return `<span class="${cls}" contenteditable="false" data-ref="${escapeHtml(tid + '.' + cid)}" title="${escapeHtml(tooltip)}">${escapeHtml(label)}</span>`;
    })
    .replace(/\n/g, '<br>');
}

/* Walk contenteditable div nodes, building plain text with {{...}} placeholders */
function serializeEditable(node) {
  let result = '';
  node.childNodes.forEach(child => {
    if (child.nodeType === Node.TEXT_NODE) {
      // Replace non-breaking space with regular space, normalize
      result += (child.textContent || '').replace(/\u00A0/g, ' ');
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      if (child.classList && child.classList.contains('var-pill')) {
        const ref = child.dataset.ref || '';
        if (ref) result += `{{${ref}}}`;
      } else if (child.tagName === 'BR') {
        result += '\n';
      } else if (child.tagName === 'DIV' || child.tagName === 'P') {
        // Browsers wrap line breaks in divs in contenteditable
        if (result && !result.endsWith('\n')) result += '\n';
        result += serializeEditable(child);
      } else {
        result += serializeEditable(child);
      }
    }
  });
  return result;
}

/* Insert a variable pill at the current cursor position inside a target editable */
function insertVarPill(targetDiv, tableId, columnId) {
  const found = findColumn(tableId, columnId);
  if (!found || !targetDiv) return;
  const span = document.createElement('span');
  span.className = 'var-pill';
  span.contentEditable = 'false';
  span.dataset.ref = `${tableId}.${columnId}`;
  span.title = `${found.table.name} → ${found.column.name}`;
  span.textContent = found.column.name;
  // Trailing space (regular, gets normalized) for natural typing after the pill
  const trailing = document.createTextNode(' ');

  targetDiv.focus();
  const sel = window.getSelection();
  let inserted = false;
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    if (targetDiv.contains(range.commonAncestorContainer) || range.commonAncestorContainer === targetDiv) {
      range.deleteContents();
      range.insertNode(trailing);
      range.insertNode(span);
      // Move cursor after the trailing space
      range.setStartAfter(trailing);
      range.setEndAfter(trailing);
      sel.removeAllRanges();
      sel.addRange(range);
      inserted = true;
    }
  }
  if (!inserted) {
    targetDiv.appendChild(span);
    targetDiv.appendChild(trailing);
    // Place cursor at end
    const range = document.createRange();
    range.selectNodeContents(targetDiv);
    range.collapse(false);
    if (sel) {
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
  // Trigger input event so models update via the bound listener
  targetDiv.dispatchEvent(new Event('input', { bubbles: true }));
}

function openDataTableModal(id) {
  const isNew = !id;
  const table = isNew
    ? { id: uid(), name: '', columns: [], rows: [] }
    : JSON.parse(JSON.stringify(state.dataTables.find(t => t.id === id)));
  if (!Array.isArray(table.columns)) table.columns = [];
  if (!Array.isArray(table.rows)) table.rows = [];

  openModal(isNew ? 'Nouvelle table de données' : 'Éditer la table', `
    <div class="form-group">
      <label class="field-label">Nom de la table <span class="required">*</span></label>
      <input type="text" id="dt-name" value="${escapeHtml(table.name)}" placeholder="Ex. Clients, Montants, Comptes bancaires">
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">Définissez les colonnes (variables insérables) et remplissez les lignes (données fournies au testeur).</div>
    </div>
    <div class="form-group">
      <label class="field-label">Structure et données</label>
      <div id="dt-grid-wrapper"></div>
    </div>
  `, `
    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="dt-save">${isNew ? 'Créer' : 'Enregistrer'}</button>
  `, (body) => {
    body.querySelector('#dt-name').focus();

    function renderGrid() {
      const wrapper = body.querySelector('#dt-grid-wrapper');
      const cols = table.columns;
      const rows = table.rows;
      let html = '<div class="data-grid"><table>';
      // Header
      html += '<thead><tr>';
      cols.forEach((c, ci) => {
        html += `<th><div class="col-head">
          <input type="text" data-col-name="${ci}" value="${escapeHtml(c.name || '')}" placeholder="Nom de colonne">
          <button type="button" data-col-delete="${ci}" title="Supprimer la colonne">${ICON.close}</button>
        </div></th>`;
      });
      html += `<th class="add-col-cell"><button type="button" id="dt-add-col" title="Ajouter une colonne">+</button></th>`;
      html += '</tr></thead>';
      // Body
      html += '<tbody>';
      if (cols.length === 0) {
        html += `<tr><td colspan="2" style="padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;font-style:italic;">Ajoutez d'abord au moins une colonne avec le bouton « + » ci-dessus.</td></tr>`;
      } else {
        rows.forEach((row, ri) => {
          html += '<tr>';
          cols.forEach(c => {
            const value = row[c.id] || '';
            html += `<td><input type="text" data-cell="${ri}.${c.id}" value="${escapeHtml(value)}" placeholder="—"></td>`;
          });
          html += `<td class="row-action"><button type="button" data-row-delete="${ri}" title="Supprimer la ligne">${ICON.close}</button></td>`;
          html += '</tr>';
        });
        // Add row button
        html += `<tr><td colspan="${cols.length + 1}" style="padding:8px;text-align:center;background:var(--surface-soft);">
          <button type="button" id="dt-add-row" class="add-row-btn">+ Ajouter une ligne</button>
        </td></tr>`;
      }
      html += '</tbody></table></div>';
      wrapper.innerHTML = html;

      // Wire column rename
      wrapper.querySelectorAll('[data-col-name]').forEach(input => {
        input.oninput = (e) => {
          table.columns[+input.dataset.colName].name = e.target.value;
        };
      });
      // Wire column delete
      wrapper.querySelectorAll('[data-col-delete]').forEach(btn => {
        btn.onclick = () => {
          const ci = +btn.dataset.colDelete;
          if (!confirm('Supprimer cette colonne et toutes ses valeurs ?')) return;
          const colId = table.columns[ci].id;
          table.columns.splice(ci, 1);
          table.rows.forEach(r => { delete r[colId]; });
          renderGrid();
        };
      });
      // Wire add column
      const addCol = wrapper.querySelector('#dt-add-col');
      if (addCol) addCol.onclick = () => {
        table.columns.push({ id: uid(), name: '' });
        renderGrid();
        // Focus the new column name input
        setTimeout(() => {
          const inputs = wrapper.querySelectorAll('[data-col-name]');
          if (inputs.length > 0) inputs[inputs.length - 1].focus();
        }, 0);
      };
      // Wire cell edit
      wrapper.querySelectorAll('[data-cell]').forEach(input => {
        input.oninput = (e) => {
          const [ri, colId] = input.dataset.cell.split('.');
          if (!table.rows[+ri]) return;
          table.rows[+ri][colId] = e.target.value;
        };
      });
      // Wire row delete
      wrapper.querySelectorAll('[data-row-delete]').forEach(btn => {
        btn.onclick = () => {
          table.rows.splice(+btn.dataset.rowDelete, 1);
          renderGrid();
        };
      });
      // Wire add row
      const addRow = wrapper.querySelector('#dt-add-row');
      if (addRow) addRow.onclick = () => {
        const newRow = {};
        table.columns.forEach(c => { newRow[c.id] = ''; });
        table.rows.push(newRow);
        renderGrid();
      };
    }
    renderGrid();

    document.getElementById('dt-save').onclick = () => {
      const name = body.querySelector('#dt-name').value.trim();
      if (!name) { toast('Le nom est requis'); return; }
      // Validate columns: must have a name (auto-trim, drop empty cols at save? — keep, just trim)
      table.columns.forEach(c => { c.name = (c.name || '').trim(); });
      const emptyCols = table.columns.filter(c => !c.name);
      if (emptyCols.length > 0) {
        toast('Toutes les colonnes doivent avoir un nom');
        return;
      }
      table.name = name;
      if (isNew) {
        state.dataTables.push(table);
      } else {
        const idx = state.dataTables.findIndex(t => t.id === id);
        state.dataTables[idx] = table;
      }
      save();
      closeModal();
      switchTab('data');
      toast(isNew ? 'Table créée' : 'Table modifiée');
    };
  });
}

/* Compute the full Jira URL for a ticket key, using the global Jira base URL.
   Empty string if no base URL is configured or no key. */
function jiraUrlFor(key) {
  if (!key) return '';
  const base = ((state.settings || {}).jiraBaseUrl || '').trim();
  if (!base) return '';
  // Normalize: strip trailing slash if any
  const cleanBase = base.replace(/\/+$/, '');
  return cleanBase + '/browse/' + encodeURIComponent(key);
}

/* =====================================================================
   STEP BLOCKS — procédures réutilisables
   Un bloc est une séquence d'étapes nommée. Les cas de tests peuvent
   référencer un bloc, qui est expansé à l'exécution (checklist, spec).
   ===================================================================== */

/* Expand step blocks references into a flat list of resolved step objects.
   Each resolved step is either:
   - A direct step: { action, expected, requiresScreenshot }
   - A block-derived step: { action, expected, requiresScreenshot, fromBlock: {id, name, missing?} } */
function expandSteps(steps) {
  const result = [];
  (steps || []).forEach(s => {
    if (!s) return;
    if (s.type === 'block' && s.blockId) {
      const block = (state.stepBlocks || []).find(b => b.id === s.blockId);
      if (block) {
        (block.steps || []).forEach(bs => {
          if (bs.type === 'block') return; // no nested blocks
          result.push({
            action: bs.action || '',
            expected: bs.expected || '',
            requiresScreenshot: !!bs.requiresScreenshot,
            fromBlock: { id: block.id, name: block.name }
          });
        });
      } else {
        result.push({
          action: '(bloc supprimé)',
          expected: '',
          requiresScreenshot: false,
          fromBlock: { id: s.blockId, name: '?', missing: true }
        });
      }
    } else {
      result.push({
        action: s.action || '',
        expected: s.expected || '',
        requiresScreenshot: !!s.requiresScreenshot
      });
    }
  });
  return result;
}

/* How many cases (top-level state.testCases) reference this block? */
function casesUsingBlock(blockId) {
  return state.testCases.filter(c => (c.steps || []).some(s => s.type === 'block' && s.blockId === blockId));
}

function openBlockModal(id) {
  const isNew = !id;
  const block = isNew
    ? { id: uid(), name: '', steps: [{ type: 'step', action: '', expected: '', requiresScreenshot: false }] }
    : JSON.parse(JSON.stringify(state.stepBlocks.find(b => b.id === id)));
  if (!Array.isArray(block.steps)) block.steps = [];
  block.steps.forEach(s => { if (!s.type) s.type = 'step'; });

  openModal(isNew ? 'Nouveau bloc d\'étapes' : 'Modifier le bloc', `
    <div class="form-group">
      <label class="field-label">Nom du bloc <span class="required">*</span></label>
      <input type="text" id="blk-name" value="${escapeHtml(block.name)}" placeholder="Ex. Ouvrir profil client">
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">Ce nom apparaîtra à l'insertion dans un cas de test et comme étiquette « via Bloc … » dans la checklist.</div>
    </div>

    <div class="form-group">
      <label class="field-label">Étapes</label>
      <div id="blk-var-toolbox"></div>
      <div class="steps-editor" id="blk-steps"></div>
      <button type="button" class="btn btn-sm" id="blk-add-step" style="margin-top:8px;align-self:flex-start;">${ICON.plus}<span>Ajouter une étape</span></button>
    </div>
  `, `
    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="blk-save">${isNew ? 'Créer' : 'Enregistrer'}</button>
  `, (body) => {
    body.querySelector('#blk-name').focus();

    let lastFocusedEditable = null;
    function refreshVarToolbox() {
      const tb = body.querySelector('#blk-var-toolbox');
      tb.innerHTML = renderVarToolboxHtml();
      tb.querySelectorAll('[data-insert-var]').forEach(btn => {
        btn.onclick = () => {
          if (!lastFocusedEditable) { toast('Cliquez d\'abord dans une étape'); return; }
          const ref = btn.dataset.insertVar;
          const [tableId, columnId] = ref.split('.');
          insertVarPill(lastFocusedEditable, tableId, columnId);
        };
      });
    }
    refreshVarToolbox();

    function renderSteps() {
      const c = body.querySelector('#blk-steps');
      const total = block.steps.length;
      c.innerHTML = block.steps.map((s, i) => `
        <div class="step-row">
          <div class="step-num">${i + 1}</div>
          <div class="step-rich" contenteditable="true" data-blk-action="${i}" data-placeholder="Action">${renderEditableContent(s.action || '')}</div>
          <div class="step-rich" contenteditable="true" data-blk-expected="${i}" data-placeholder="Résultat attendu">${renderEditableContent(s.expected || '')}</div>
          <div class="step-actions">
            <button type="button" class="step-shot-toggle ${s.requiresScreenshot ? 'active' : ''}" data-blk-shot="${i}" title="Capture requise">${ICON.image}</button>
            <button type="button" class="btn-icon btn-ghost" data-blk-up="${i}" ${i === 0 ? 'disabled' : ''} title="Monter">↑</button>
            <button type="button" class="btn-icon btn-ghost" data-blk-down="${i}" ${i === total - 1 ? 'disabled' : ''} title="Descendre">↓</button>
            <button type="button" class="btn-icon btn-ghost" data-blk-remove="${i}" title="Retirer">${ICON.close}</button>
          </div>
        </div>
      `).join('');
      c.querySelectorAll('[data-blk-action], [data-blk-expected]').forEach(el => {
        const isAction = 'blkAction' in el.dataset;
        const idx = +(isAction ? el.dataset.blkAction : el.dataset.blkExpected);
        const key = isAction ? 'action' : 'expected';
        el.addEventListener('focus', () => { lastFocusedEditable = el; });
        el.addEventListener('mouseup', () => { lastFocusedEditable = el; });
        el.addEventListener('keyup', () => { lastFocusedEditable = el; });
        el.addEventListener('input', () => { block.steps[idx][key] = serializeEditable(el); });
        el.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          document.execCommand('insertText', false, text);
        });
      });
      c.querySelectorAll('[data-blk-shot]').forEach(b => b.onclick = () => {
        const i = +b.dataset.blkShot;
        block.steps[i].requiresScreenshot = !block.steps[i].requiresScreenshot;
        b.classList.toggle('active', block.steps[i].requiresScreenshot);
      });
      c.querySelectorAll('[data-blk-up]').forEach(b => b.onclick = () => {
        const i = +b.dataset.blkUp;
        if (i > 0) {
          [block.steps[i - 1], block.steps[i]] = [block.steps[i], block.steps[i - 1]];
          lastFocusedEditable = null;
          renderSteps();
        }
      });
      c.querySelectorAll('[data-blk-down]').forEach(b => b.onclick = () => {
        const i = +b.dataset.blkDown;
        if (i < block.steps.length - 1) {
          [block.steps[i + 1], block.steps[i]] = [block.steps[i], block.steps[i + 1]];
          lastFocusedEditable = null;
          renderSteps();
        }
      });
      c.querySelectorAll('[data-blk-remove]').forEach(b => b.onclick = () => {
        block.steps.splice(+b.dataset.blkRemove, 1);
        if (block.steps.length === 0) block.steps.push({ type: 'step', action: '', expected: '', requiresScreenshot: false });
        lastFocusedEditable = null;
        renderSteps();
      });
    }
    renderSteps();
    body.querySelector('#blk-add-step').onclick = () => {
      block.steps.push({ type: 'step', action: '', expected: '', requiresScreenshot: false });
      renderSteps();
    };

    document.getElementById('blk-save').onclick = () => {
      const name = body.querySelector('#blk-name').value.trim();
      if (!name) { toast('Le nom est requis'); return; }
      block.name = name;
      // Drop empty steps
      block.steps = block.steps.filter(s => (s.action || '').trim() || (s.expected || '').trim());
      if (block.steps.length === 0) { toast('Au moins une étape avec contenu est requise'); return; }
      block.steps.forEach(s => { s.type = 'step'; });
      if (isNew) {
        state.stepBlocks.push(block);
      } else {
        const idx = state.stepBlocks.findIndex(b => b.id === id);
        state.stepBlocks[idx] = block;
      }
      save();
      closeModal();
      switchTab('blocks');
      toast(isNew ? 'Bloc créé' : 'Bloc modifié');
    };
  });
}

/* Anchored popover: pick a block to insert into a test case.
   Does NOT use openModal — would destroy the parent modal. Renders as a
   floating panel attached to the anchor button, closes on outside click or Esc. */
let _blockPickerEl = null;
let _blockPickerCleanup = null;
function closeBlockPicker() {
  if (_blockPickerEl) { _blockPickerEl.remove(); _blockPickerEl = null; }
  if (_blockPickerCleanup) { _blockPickerCleanup(); _blockPickerCleanup = null; }
}
function showBlockPicker(anchorEl, onSelect) {
  closeBlockPicker();
  const blocks = state.stepBlocks || [];
  if (blocks.length === 0) {
    toast('Aucun bloc défini. Créez-en dans l\'onglet Blocs.');
    return;
  }
  const popover = document.createElement('div');
  popover.className = 'block-picker-popover';
  const rect = anchorEl.getBoundingClientRect();
  popover.style.position = 'fixed';
  popover.style.top = (rect.bottom + 6) + 'px';
  popover.style.left = rect.left + 'px';

  function renderItems(filter) {
    const f = (filter || '').toLowerCase();
    const filtered = f
      ? blocks.filter(b => (b.name || '').toLowerCase().includes(f) || (b.steps || []).some(s => (s.action || '').toLowerCase().includes(f)))
      : blocks;
    if (filtered.length === 0) {
      return '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;font-style:italic;">Aucun bloc ne correspond.</div>';
    }
    return filtered.map(b => {
      const stepCount = (b.steps || []).length;
      const preview = stepCount > 0 ? ((b.steps[0].action || '').slice(0, 60)) + ((b.steps[0].action || '').length > 60 ? '…' : '') : '(vide)';
      return `
        <button type="button" class="block-picker-item" data-pick-block-id="${b.id}">
          <span class="block-picker-name">${escapeHtml(b.name)}</span>
          <span class="block-picker-meta">${stepCount} étape${stepCount > 1 ? 's' : ''}${preview ? ' · ' + escapeHtml(preview) : ''}</span>
        </button>
      `;
    }).join('');
  }

  popover.innerHTML = `
    <div class="block-picker-header">${ICON.layers}<span>Insérer un bloc</span></div>
    ${blocks.length > 5 ? `<div class="block-picker-search-row"><input type="text" class="block-picker-search" placeholder="Rechercher un bloc…" autofocus></div>` : ''}
    <div class="block-picker-list">${renderItems('')}</div>
  `;
  document.body.appendChild(popover);
  _blockPickerEl = popover;

  // Compute viewport-aware position: prefer below anchor, but flip above if cramped
  const margin = 12;
  const gap = 6;
  const minPanelHeight = 200;
  const spaceBelow = window.innerHeight - rect.bottom - gap - margin;
  const spaceAbove = rect.top - gap - margin;
  let topPx, maxH;
  if (spaceBelow >= minPanelHeight || spaceBelow >= spaceAbove) {
    topPx = rect.bottom + gap;
    maxH = Math.max(minPanelHeight, spaceBelow);
  } else {
    maxH = Math.max(minPanelHeight, spaceAbove);
    topPx = Math.max(margin, rect.top - gap - maxH);
  }
  popover.style.top = topPx + 'px';
  popover.style.maxHeight = maxH + 'px';

  const popRect = popover.getBoundingClientRect();
  if (popRect.right > window.innerWidth - margin) {
    popover.style.left = Math.max(margin, window.innerWidth - popRect.width - margin) + 'px';
  }

  // Wire search input
  const searchInput = popover.querySelector('.block-picker-search');
  const listEl = popover.querySelector('.block-picker-list');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      listEl.innerHTML = renderItems(e.target.value);
      wireItems();
    });
  }
  function wireItems() {
    listEl.querySelectorAll('[data-pick-block-id]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const blockId = item.dataset.pickBlockId;
        closeBlockPicker();
        onSelect(blockId);
      });
    });
  }
  wireItems();

  // Outside-click and Esc handling — defer attachment so the opening click doesn't trigger
  setTimeout(() => {
    const onDocClick = (e) => {
      if (popover.contains(e.target) || e.target === anchorEl || anchorEl.contains(e.target)) return;
      closeBlockPicker();
    };
    const onKey = (e) => { if (e.key === 'Escape') closeBlockPicker(); };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
    _blockPickerCleanup = () => {
      document.removeEventListener('mousedown', onDocClick);
      document.removeEventListener('keydown', onKey);
    };
  }, 0);
}

/* DEPRECATED: kept for backward compat, redirects to popover. The original
   modal-based picker would destroy the parent modal — never use it. */
function openBlockPicker(onSelect) {
  console.warn('openBlockPicker (modal) is deprecated; use showBlockPicker(anchor, onSelect) instead');
  toast('Veuillez utiliser le bouton « Insérer un bloc »');
}

/* =====================================================================
   ANOMALIES — défauts découverts pendant l'exécution des tests
   ===================================================================== */
function anomalyStateBadgeClass(stateId) {
  const map = {
    discovered: 'badge-danger',
    in_progress: 'badge-primary',
    workaround_pending: 'badge-accent',
    workaround_accepted: 'badge-muted',
    fixed: 'badge-success',
    closed: 'badge-success',
    rejected: 'badge-muted',
  };
  return map[stateId] || 'badge';
}

function anomalySeverityBadgeClass(sevId) {
  const map = {
    critical: 'badge-danger',
    major: 'badge-accent',
    minor: 'badge-muted',
    trivial: 'badge-muted',
  };
  return map[sevId] || 'badge';
}

function anomalyStateLabel(id) { return (ANOMALY_STATES.find(s => s.id === id) || {}).label || id; }
function anomalyTypeLabel(id) { return (ANOMALY_TYPES.find(t => t.id === id) || {}).label || id; }
function anomalySeverityLabel(id) { return (ANOMALY_SEVERITIES.find(s => s.id === id) || {}).label || id; }

function anomalyIsOpen(a) {
  const st = ANOMALY_STATES.find(s => s.id === a.state);
  return st && st.kind === 'open';
}

function anomalyStats() {
  const all = state.anomalies || [];
  const open = all.filter(anomalyIsOpen);
  const orphans = all.filter(a => !a.testCaseIds || a.testCaseIds.length === 0);
  const criticalOpen = open.filter(a => a.severity === 'critical');
  return {
    total: all.length,
    open: open.length,
    closed: all.length - open.length,
    orphans: orphans.length,
    criticalOpen: criticalOpen.length,
    orphansList: orphans,
    criticalOpenList: criticalOpen,
  };
}

function renderAnomalies(view) {
  const all = state.anomalies || [];
  const stats = anomalyStats();

  // Sort: open first, then severity (critical→trivial), then createdAt desc
  const SEV_ORDER = { critical: 0, major: 1, minor: 2, trivial: 3 };
  const sorted = [...all].sort((a, b) => {
    const ao = anomalyIsOpen(a) ? 0 : 1;
    const bo = anomalyIsOpen(b) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    const sa = SEV_ORDER[a.severity] != null ? SEV_ORDER[a.severity] : 9;
    const sb = SEV_ORDER[b.severity] != null ? SEV_ORDER[b.severity] : 9;
    if (sa !== sb) return sa - sb;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  const openList = sorted.filter(anomalyIsOpen);
  const closedList = sorted.filter(a => !anomalyIsOpen(a));

  view.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Anomalies</h1>
        <div class="subtitle">Défauts découverts pendant les tests. Liez chaque anomalie au cas de test qui l'a révélée.</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="add-anomaly">${ICON.plus}<span>Nouvelle anomalie</span></button>
      </div>
    </div>

    ${stats.orphans > 0 ? `
      <div class="alert-banner warn">
        ${ICON.alert}
        <div class="body">
          <strong>${stats.orphans} anomalie${stats.orphans > 1 ? 's' : ''} sans cas de test lié</strong>
          La traçabilité exige qu'une anomalie soit reliée au cas de test qui l'a révélée. Ouvrez chaque anomalie concernée pour la lier.
        </div>
      </div>
    ` : ''}

    ${all.length > 0 ? `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
        <span class="badge">${stats.total} total</span>
        <span class="badge ${stats.open > 0 ? 'badge-accent' : 'badge-muted'}">${stats.open} ouverte${stats.open > 1 ? 's' : ''}</span>
        ${stats.criticalOpen > 0 ? `<span class="badge badge-danger">${stats.criticalOpen} critique${stats.criticalOpen > 1 ? 's' : ''} ouverte${stats.criticalOpen > 1 ? 's' : ''}</span>` : ''}
        <span class="badge badge-success">${stats.closed} fermée${stats.closed > 1 ? 's' : ''}</span>
      </div>
    ` : ''}

    ${all.length === 0 ? emptyState('Aucune anomalie', 'Cliquez sur « Nouvelle anomalie » pour enregistrer un défaut.') : ''}

    ${openList.length > 0 ? `
      <div class="folder-section">
        <div class="folder-header">
          ${ICON.alert}
          <span>Anomalies ouvertes</span>
          <span class="count">${openList.length}</span>
        </div>
        <div class="card-grid">
          ${openList.map(renderAnomalyCard).join('')}
        </div>
      </div>
    ` : ''}

    ${closedList.length > 0 ? `
      <div class="folder-section" style="opacity:0.85;">
        <div class="folder-header">
          ${ICON.case}
          <span>Anomalies fermées</span>
          <span class="count">${closedList.length}</span>
        </div>
        <div class="card-grid">
          ${closedList.map(renderAnomalyCard).join('')}
        </div>
      </div>
    ` : ''}
  `;

  document.getElementById('add-anomaly').onclick = () => openAnomalyModal();
  view.querySelectorAll('[data-edit-anomaly]').forEach(b => b.onclick = () => openAnomalyModal(b.dataset.editAnomaly));
  view.querySelectorAll('[data-delete-anomaly]').forEach(b => b.onclick = () => {
    confirmDialog('Supprimer cette anomalie ?', () => {
      state.anomalies = state.anomalies.filter(a => a.id !== b.dataset.deleteAnomaly);
      save();
      renderAnomalies(view);
      toast('Anomalie supprimée');
    });
  });
}

function renderAnomalyCard(a) {
  const linkedCases = (a.testCaseIds || [])
    .map(id => state.testCases.find(c => c.id === id))
    .filter(Boolean);
  const orphan = linkedCases.length === 0;
  const desc = a.description || '';
  const descPreview = desc.slice(0, 180);
  const truncated = desc.length > 180;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <h3 style="font-size:15px;flex:1;line-height:1.35;">${escapeHtml(a.title || '(sans titre)')}</h3>
        <div style="display:flex;gap:2px;flex-shrink:0;">
          <button class="btn-icon btn-ghost" data-edit-anomaly="${a.id}" title="Modifier">${ICON.edit}</button>
          <button class="btn-icon btn-ghost" data-delete-anomaly="${a.id}" title="Supprimer">${ICON.trash}</button>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px;">
        <span class="badge ${anomalyStateBadgeClass(a.state)}">${escapeHtml(anomalyStateLabel(a.state))}</span>
        <span class="badge ${anomalySeverityBadgeClass(a.severity)}">${escapeHtml(anomalySeverityLabel(a.severity))}</span>
        <span class="badge">${escapeHtml(anomalyTypeLabel(a.type))}</span>
      </div>
      ${descPreview ? `
        <p style="font-size:12.5px;color:var(--text-soft);margin:0 0 10px;line-height:1.5;">
          ${escapeHtml(descPreview)}${truncated ? '…' : ''}
        </p>
      ` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);padding-top:10px;border-top:1px solid var(--border);align-items:center;">
        ${orphan
          ? `<span class="badge badge-danger" style="font-size:10.5px;padding:1px 6px;">⚠ Sans cas lié</span>`
          : `<span style="display:inline-flex;align-items:center;gap:4px;">${ICON.link}${linkedCases.length} cas lié${linkedCases.length > 1 ? 's' : ''}</span>`}
        ${(a.screenshots || []).length > 0 ? `<span>${(a.screenshots || []).length} capture${(a.screenshots || []).length > 1 ? 's' : ''}</span>` : ''}
        ${a.peopleInvolved ? `<span title="${escapeHtml(a.peopleInvolved)}">${escapeHtml(a.peopleInvolved.length > 30 ? a.peopleInvolved.slice(0, 30) + '…' : a.peopleInvolved)}</span>` : ''}
        ${a.createdAt ? `<span style="margin-left:auto;">${escapeHtml((a.createdAt || '').slice(0, 10))}</span>` : ''}
      </div>
    </div>
  `;
}

function openAnomalyModal(id) {
  const isNew = !id;
  const anomaly = isNew
    ? {
        id: uid(),
        title: '',
        description: '',
        type: 'functional',
        severity: 'major',
        state: 'discovered',
        testCaseIds: [],
        workaround: '',
        solution: '',
        peopleInvolved: '',
        screenshots: [],
        createdAt: new Date().toISOString(),
        resolvedAt: null,
      }
    : JSON.parse(JSON.stringify(state.anomalies.find(a => a.id === id)));

  // Group test cases by folder for the picker
  const grouped = {};
  state.testCases.forEach(c => {
    const f = folderOf(c);
    if (!grouped[f.id]) grouped[f.id] = { folder: f, cases: [] };
    grouped[f.id].cases.push(c);
  });
  const groupedSorted = Object.values(grouped).sort((a, b) => a.folder.name.localeCompare(b.folder.name));

  openModal(isNew ? 'Nouvelle anomalie' : "Modifier l'anomalie", `
    <div class="form-group">
      <label class="field-label">Titre <span class="required">*</span></label>
      <input type="text" id="an-title" value="${escapeHtml(anomaly.title)}" placeholder="Ex. Calcul TVA incorrect en cas de remise négative">
    </div>

    <div class="form-row form-row-3">
      <div class="form-group">
        <label class="field-label">État</label>
        <select id="an-state">
          ${ANOMALY_STATES.map(s => `<option value="${s.id}" ${anomaly.state === s.id ? 'selected' : ''}>${escapeHtml(s.label)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="field-label">Sévérité</label>
        <select id="an-severity">
          ${ANOMALY_SEVERITIES.map(s => `<option value="${s.id}" ${anomaly.severity === s.id ? 'selected' : ''} title="${escapeHtml(s.desc)}">${escapeHtml(s.label)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="field-label">Type ISTQB</label>
        <select id="an-type">
          ${ANOMALY_TYPES.map(t => `<option value="${t.id}" ${anomaly.type === t.id ? 'selected' : ''} title="${escapeHtml(t.desc)}">${escapeHtml(t.label)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">Description <span class="required">*</span></label>
      <textarea id="an-description" rows="4" placeholder="Décrivez le comportement constaté, les étapes pour reproduire, et le comportement attendu.">${escapeHtml(anomaly.description)}</textarea>
    </div>

    <div class="form-group">
      <label class="field-label">Cas de tests liés <span class="hint">la liaison est requise pour la traçabilité</span></label>
      ${state.testCases.length === 0 ?
        '<p style="font-size:12.5px;color:var(--text-muted);">Aucun cas de test disponible. Créez-en d’abord dans l’onglet « Cas de tests ».</p>' :
        `<div class="picker" id="an-cases" style="max-height:220px;">
          ${groupedSorted.map(g => `
            <div style="padding:6px 10px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;background:var(--surface-soft);border-bottom:1px solid var(--border);">
              ${escapeHtml(g.folder.name)}
            </div>
            ${g.cases.map(c => `
              <label class="picker-item">
                <input type="checkbox" value="${c.id}" ${(anomaly.testCaseIds || []).includes(c.id) ? 'checked' : ''}>
                <span>${escapeHtml(c.title)}</span>
                <span class="meta">${c.ready ? 'prêt' : 'brouillon'}</span>
              </label>
            `).join('')}
          `).join('')}
        </div>`}
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="field-label">Contournement <span class="hint">si applicable</span></label>
        <textarea id="an-workaround" rows="3" placeholder="Comment l'utilisateur peut éviter le problème en attendant le correctif.">${escapeHtml(anomaly.workaround)}</textarea>
      </div>
      <div class="form-group">
        <label class="field-label">Solution <span class="hint">une fois résolue</span></label>
        <textarea id="an-solution" rows="3" placeholder="Description du correctif appliqué.">${escapeHtml(anomaly.solution)}</textarea>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">Personnes impliquées</label>
      <input type="text" id="an-people" value="${escapeHtml(anomaly.peopleInvolved)}" placeholder="Ex. Sophie Lambert (dev), Marc Dubois (PO), Jean Dupont (testeur)">
    </div>

    <div class="form-group">
      <label class="field-label">Captures d'écran</label>
      <div id="an-shots-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px;"></div>
      <input type="file" id="an-shot-input" accept="image/*" multiple style="display:none;">
      <button type="button" class="btn" id="an-add-shot">${ICON.image}<span>Ajouter une capture</span></button>
    </div>

    ${anomaly.createdAt ? `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);display:flex;gap:18px;flex-wrap:wrap;">
        <span>Créée le <strong>${escapeHtml((anomaly.createdAt || '').slice(0, 10))}</strong></span>
        ${anomaly.resolvedAt ? `<span>Fermée le <strong>${escapeHtml((anomaly.resolvedAt || '').slice(0, 10))}</strong></span>` : ''}
      </div>
    ` : ''}
  `, `
    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="an-save">${isNew ? 'Créer' : 'Enregistrer'}</button>
  `, (body) => {
    function renderShots() {
      const grid = body.querySelector('#an-shots-grid');
      if (!anomaly.screenshots || anomaly.screenshots.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;font-size:12.5px;color:var(--text-muted);font-style:italic;padding:6px 0;">Aucune capture pour le moment.</div>';
        return;
      }
      grid.innerHTML = anomaly.screenshots.map((s, i) => `
        <div style="position:relative;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-soft);">
          <img src="${s.data}" alt="" style="width:100%;height:100px;object-fit:cover;display:block;">
          <button type="button" data-remove-shot="${i}" title="Retirer" style="position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(31,41,55,0.7);color:white;border:none;display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1;">×</button>
        </div>
      `).join('');
      grid.querySelectorAll('[data-remove-shot]').forEach(b => b.onclick = () => {
        anomaly.screenshots.splice(+b.dataset.removeShot, 1);
        renderShots();
      });
    }
    renderShots();

    body.querySelector('#an-add-shot').onclick = () => body.querySelector('#an-shot-input').click();
    body.querySelector('#an-shot-input').onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      anomaly.screenshots = anomaly.screenshots || [];
      for (const file of files) {
        try {
          const data = await compressImage(file, 1200, 0.7);
          anomaly.screenshots.push({ name: file.name, data });
        } catch (err) {
          toast('Image illisible : ' + (file.name || ''));
        }
      }
      e.target.value = '';
      renderShots();
    };

    document.getElementById('an-save').onclick = () => {
      const title = body.querySelector('#an-title').value.trim();
      const description = body.querySelector('#an-description').value.trim();
      if (!title) { toast('Le titre est requis'); return; }
      if (!description) { toast('La description est requise'); return; }

      const newState = body.querySelector('#an-state').value;
      const stateMeta = ANOMALY_STATES.find(s => s.id === newState);
      const willBeOpen = stateMeta && stateMeta.kind === 'open';

      anomaly.title = title;
      anomaly.description = description;
      anomaly.state = newState;
      anomaly.severity = body.querySelector('#an-severity').value;
      anomaly.type = body.querySelector('#an-type').value;
      anomaly.testCaseIds = Array.from(body.querySelectorAll('#an-cases input:checked')).map(i => i.value);
      anomaly.workaround = body.querySelector('#an-workaround').value.trim();
      anomaly.solution = body.querySelector('#an-solution').value.trim();
      anomaly.peopleInvolved = body.querySelector('#an-people').value.trim();

      // Auto manage resolvedAt
      if (!willBeOpen && !anomaly.resolvedAt) {
        anomaly.resolvedAt = new Date().toISOString();
      } else if (willBeOpen && anomaly.resolvedAt) {
        anomaly.resolvedAt = null;
      }

      if (isNew) {
        state.anomalies.push(anomaly);
      } else {
        const idx = state.anomalies.findIndex(a => a.id === id);
        state.anomalies[idx] = anomaly;
      }
      save();
      closeModal();
      switchTab('anomalies');
      toast(isNew ? 'Anomalie créée' : 'Anomalie modifiée');
    };
  });
}
