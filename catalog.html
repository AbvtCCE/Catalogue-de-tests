<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue de Tests</title>
<style>
  /* ===== Tokens ===== */
  :root {
    --bg: #F7F4EE;
    --bg-decoration: #EFEBE2;
    --surface: #FFFFFF;
    --surface-soft: #FBF9F4;
    --text: #1F2937;
    --text-soft: #5B6472;
    --text-muted: #9AA0A8;
    --border: #E8E2D4;
    --border-strong: #D4CDBC;

    --primary: #4A6B8A;
    --primary-soft: #DDE6F0;
    --accent: #D9824B;
    --accent-soft: #F8E6D6;
    --success: #5E9A82;
    --success-soft: #DCEAE3;
    --warning: #D4A24A;
    --warning-soft: #F6EBD2;
    --danger: #B86658;
    --danger-soft: #F4DCD7;

    --memphis-1: #E8C9A5;
    --memphis-2: #B8C9D9;
    --memphis-3: #D9B5B0;
    --memphis-4: #C5D5C2;

    --shadow-sm: 0 1px 2px rgba(31,41,55,0.04);
    --shadow: 0 1px 3px rgba(31,41,55,0.06), 0 1px 2px rgba(31,41,55,0.04);
    --shadow-lg: 0 4px 12px rgba(31,41,55,0.06), 0 2px 4px rgba(31,41,55,0.04);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  /* ===== Reset ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 600; line-height: 1.3; }

  /* ===== Layout ===== */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 24px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--text);
    color: var(--surface);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    color: var(--text-soft);
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    width: 100%;
    transition: background 120ms, color 120ms;
  }
  .nav-btn:hover { background: var(--surface-soft); color: var(--text); }
  .nav-btn.active {
    background: var(--text);
    color: var(--surface);
  }
  .nav-btn svg { flex-shrink: 0; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 8px 0;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .storage-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .storage-bar > div {
    height: 100%;
    background: var(--success);
    transition: width 200ms;
  }

  /* Memphis decoration in sidebar */
  .memphis-deco {
    position: absolute;
    pointer-events: none;
    opacity: 0.45;
  }
  .memphis-deco-1 { top: -20px; right: -30px; }
  .memphis-deco-2 { bottom: 80px; left: -28px; }

  /* ===== Main ===== */
  main {
    padding: 32px 40px 60px;
    max-width: 1280px;
    width: 100%;
  }

  .tab-view { display: none; }
  .tab-view.active { display: block; }

  /* ===== Page header ===== */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h1 {
    font-size: 24px;
    letter-spacing: -0.015em;
  }
  .page-header .subtitle {
    color: var(--text-soft);
    font-size: 13.5px;
    margin-top: 4px;
  }
  .page-header .actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    transition: background 120ms, border-color 120ms;
  }
  .btn:hover { background: var(--surface-soft); border-color: var(--text-soft); }
  .btn-primary {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }
  .btn-primary:hover { background: #2d3845; border-color: #2d3845; }
  .btn-danger {
    background: var(--surface);
    color: var(--danger);
    border-color: var(--danger-soft);
  }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-soft);
  }
  .btn-ghost:hover { background: var(--surface-soft); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon {
    width: 30px; height: 30px;
    padding: 0;
    display: grid; place-items: center;
  }

  /* ===== Cards ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: box-shadow 120ms, border-color 120ms;
  }
  .card:hover { box-shadow: var(--shadow); }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .campaign-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
  }

  /* ===== Forms ===== */
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
  label.field-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-soft);
  }
  label.field-label .required { color: var(--danger); }
  label.field-label .hint { color: var(--text-muted); font-weight: 400; margin-left: 4px; }

  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 13.5px;
    transition: border-color 120ms, box-shadow 120ms;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }

  /* ===== Checkbox group ===== */
  .check-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .check-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    background: var(--surface);
    font-size: 12.5px;
    cursor: pointer;
    transition: all 120ms;
    user-select: none;
  }
  .check-pill input { display: none; }
  .check-pill:hover { border-color: var(--text-soft); }
  .check-pill.checked {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }

  /* ===== Switch / boolean ===== */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .switch input { display: none; }
  .switch-track {
    width: 36px;
    height: 20px;
    background: var(--border-strong);
    border-radius: 12px;
    position: relative;
    transition: background 150ms;
  }
  .switch-track::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--surface);
    border-radius: 50%;
    transition: transform 150ms;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .switch input:checked + .switch-track { background: var(--success); }
  .switch input:checked + .switch-track::after { transform: translateX(16px); }

  /* ===== Steps editor ===== */
  .steps-editor { display: flex; flex-direction: column; gap: 8px; }
  .step-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr auto;
    gap: 6px;
    align-items: start;
  }
  .step-row .step-actions {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .step-num {
    height: 30px;
    display: grid;
    place-items: center;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-soft);
  }
  .step-row textarea { min-height: 32px; padding: 6px 8px; }
  .step-shot-toggle {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    display: grid;
    place-items: center;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all 120ms;
  }
  .step-shot-toggle:hover {
    color: var(--text);
    border-color: var(--text-soft);
  }
  .step-shot-toggle.active {
    background: var(--accent-soft);
    color: #8a4a1f;
    border-color: var(--accent-soft);
  }

  /* ===== Screenshots ===== */
  .screenshots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .screenshot-thumb {
    position: relative;
    aspect-ratio: 4/3;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-soft);
  }
  .screenshot-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  .screenshot-remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: white;
    display: grid;
    place-items: center;
  }
  .screenshot-add {
    aspect-ratio: 4/3;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms;
  }
  .screenshot-add:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31,41,55,0.5);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 720px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 40px);
  }
  .modal-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .modal-header h2 { font-size: 17px; }
  .modal-body { padding: 24px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .modal-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: var(--surface-soft);
    flex-shrink: 0;
  }

  .modal-image-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .modal-image-viewer.open { display: flex; }
  .modal-image-viewer img { max-width: 100%; max-height: 100%; }

  /* ===== Test case list ===== */
  .folder-section {
    margin-bottom: 28px;
  }
  .folder-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: var(--surface-soft);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .folder-header .count {
    margin-left: auto;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 12px;
  }
  .folder-header.transverse { background: var(--memphis-1); color: var(--text); }
  .folder-header.interfaces { background: var(--memphis-2); color: var(--text); }

  .testcase-row {
    display: grid;
    grid-template-columns: 22px 28px 28px 1fr auto auto auto auto auto auto;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .testcase-row.selected {
    border-color: var(--primary);
    background: linear-gradient(0deg, var(--primary-soft), var(--primary-soft)), var(--surface);
    background-blend-mode: multiply;
  }
  .testcase-select {
    width: 16px; height: 16px; cursor: pointer; margin: 0;
  }

  /* ===== Bulk action bar ===== */
  .bulk-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--primary-soft);
    border: 1px solid #C0D2E5;
    border-radius: var(--radius);
    margin-bottom: 12px;
    position: sticky;
    top: 8px;
    z-index: 10;
  }
  .bulk-info {
    flex: 1;
    font-size: 13px;
    color: var(--primary);
  }
  .bulk-info strong {
    font-size: 14px;
    margin-right: 4px;
  }
  .bulk-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* ===== Bulk edit modal fields ===== */
  .bulk-field {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin: 0 0 10px;
    background: var(--surface);
  }
  .bulk-field:has(.bulk-toggle input:checked) {
    background: var(--primary-soft);
    border-color: #C0D2E5;
  }
  .bulk-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 8px;
  }
  .bulk-toggle input { margin: 0; }
  .bulk-field select:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .bulk-mode {
    display: flex;
    gap: 14px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-soft);
  }
  .bulk-mode label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .testcase-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .testcase-step-count {
    font-size: 11.5px;
    color: var(--text-soft);
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .testcase-step-count.warn {
    color: #8a4a1f;
    font-weight: 500;
  }
  .testcase-step-count.empty {
    color: #8a3a2c;
    font-weight: 500;
  }
  .testcase-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border-strong);
    flex-shrink: 0;
    margin: 0 auto;
  }
  .testcase-status.ready { background: var(--success); }
  .testcase-title {
    font-size: 13.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .testcase-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    background: var(--surface-soft);
    color: var(--text-soft);
    border: 1px solid var(--border);
  }
  .badge-success { background: var(--success-soft); color: var(--success); border-color: var(--success-soft); }
  .badge-warning { background: var(--warning-soft); color: #8a6a25; border-color: var(--warning-soft); }
  .badge-accent { background: var(--accent-soft); color: #8a4a1f; border-color: var(--accent-soft); }
  .badge-primary { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
  .badge-danger { background: #F4D9D4; color: #8a3a2c; border-color: #E8C5BD; }
  .badge-muted { background: var(--surface-soft); color: var(--text-muted); border-color: var(--border); }

  /* ===== CRUD pill (per-test classification) ===== */
  .crud-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
    flex-shrink: 0;
  }
  .crud-pill.create { background: #DCEAE3; color: #2F6754; }
  .crud-pill.read   { background: #DDE6F0; color: #4A6B8A; }
  .crud-pill.update { background: #F8E6D6; color: #8a4a1f; }
  .crud-pill.delete { background: #F4D9D4; color: #8a3a2c; }
  .crud-pill.none   { background: var(--surface-soft); color: var(--text-muted); border: 1px dashed var(--border-strong); }

  /* ===== Variable pill (in step text) ===== */
  .var-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 8px;
    margin: 0 1px;
    border-radius: 4px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #C0D2E5;
    user-select: none;
    line-height: 1.5;
    vertical-align: baseline;
    white-space: nowrap;
    cursor: default;
  }
  .var-pill::before {
    content: '⟨';
    color: var(--primary);
    opacity: 0.5;
    font-weight: 600;
  }
  .var-pill::after {
    content: '⟩';
    color: var(--primary);
    opacity: 0.5;
    font-weight: 600;
  }
  .var-pill.missing {
    background: #F4D9D4;
    color: #8a3a2c;
    border-color: #E8C5BD;
  }
  .var-pill.missing::before, .var-pill.missing::after {
    color: #8a3a2c;
  }

  /* ===== Step rich editor (contenteditable) ===== */
  .step-rich {
    width: 100%;
    min-height: 32px;
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font: inherit;
    line-height: 1.55;
    color: var(--text);
    outline: none;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .step-rich:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .step-rich:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
    pointer-events: none;
  }

  /* ===== Block reference row in step editor ===== */
  .block-ref-row {
    grid-template-columns: 28px 1fr auto !important;
    background: var(--accent-soft);
    border: 1px dashed #EFD3B8;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin: 2px 0;
  }
  .block-ref-row.missing {
    background: #F4D9D4;
    border-color: #E8C5BD;
  }
  .block-ref-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .block-ref-name {
    display: flex; align-items: center; gap: 6px;
    font-weight: 500; font-size: 13px; color: var(--accent);
  }
  .block-ref-row.missing .block-ref-name { color: #8a3a2c; }
  .block-ref-sub { font-size: 11.5px; color: var(--text-soft); }

  /* ===== Block picker popover (anchored to button) ===== */
  .block-picker-popover {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width: 320px;
    max-width: 420px;
    max-height: 360px;
    display: flex;
    flex-direction: column;
    z-index: 9999;
    overflow: hidden;
  }
  .block-picker-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-soft);
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .block-picker-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
  }
  .block-picker-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
  }
  .block-picker-item:hover {
    background: var(--surface-soft);
  }
  .block-picker-name {
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
  }
  .block-picker-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ===== Jira tickets list (in test case modal) ===== */
  .jira-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .jira-row {
    display: grid;
    grid-template-columns: 28px 130px 1fr auto;
    gap: 6px;
    align-items: center;
  }
  .jira-row .jira-num {
    height: 30px;
    display: grid;
    place-items: center;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .jira-row input[type="text"], .jira-row input[type="url"] {
    height: 32px;
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font: inherit;
    font-size: 13px;
  }
  .jira-row input.jira-key {
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    font-weight: 500;
    text-transform: uppercase;
  }
  .jira-row .jira-actions {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .jira-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    background: #E8F0FB;
    color: #1F4173;
    border: 1px solid #C8D9EE;
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
  }
  .jira-pill:hover {
    background: #D9E5F4;
    border-color: var(--primary);
  }
  .jira-pill .ext-icon {
    opacity: 0.55;
  }

  /* ===== Variable toolbox (above steps editor) ===== */
  .var-toolbox {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .var-toolbox-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .var-toolbox-empty {
    font-size: 12.5px;
    color: var(--text-muted);
    font-style: italic;
  }
  .var-toolbox-table {
    margin-bottom: 6px;
  }
  .var-toolbox-table:last-child { margin-bottom: 0; }
  .var-toolbox-table-name {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 4px;
  }
  .var-toolbox-cols {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .var-toolbox-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 4px;
    background: var(--surface);
    color: var(--primary);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #C0D2E5;
    cursor: pointer;
    transition: all 100ms;
    line-height: 1.5;
  }
  .var-toolbox-btn:hover {
    background: var(--primary-soft);
    border-color: var(--primary);
  }
  .var-toolbox-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== Data table editor ===== */
  .data-grid {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: auto;
    background: var(--surface);
    max-width: 100%;
  }
  .data-grid table {
    border-collapse: collapse;
    min-width: 100%;
  }
  .data-grid th, .data-grid td {
    border: 1px solid var(--border);
    padding: 0;
    vertical-align: top;
    background: var(--surface);
  }
  .data-grid th {
    background: var(--surface-soft);
    padding: 6px 8px;
    font-weight: 600;
    text-align: left;
    font-size: 12.5px;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .data-grid th .col-head {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .data-grid th .col-head input {
    flex: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-weight: 600;
    padding: 2px 4px;
    border-radius: 3px;
    min-width: 80px;
  }
  .data-grid th .col-head input:focus {
    outline: 1px solid var(--primary);
    background: var(--surface);
  }
  .data-grid th .col-head button {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .data-grid th .col-head button:hover {
    background: #F4D9D4;
    color: #8a3a2c;
  }
  .data-grid td input {
    width: 100%;
    border: none;
    background: transparent;
    font: inherit;
    padding: 6px 8px;
    border-radius: 0;
  }
  .data-grid td input:focus {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
    background: var(--surface);
  }
  .data-grid .row-action {
    width: 32px;
    text-align: center;
    background: var(--surface-soft);
  }
  .data-grid .row-action button {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 3px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .data-grid .row-action button:hover {
    background: #F4D9D4;
    color: #8a3a2c;
  }
  .data-grid .add-col-cell {
    background: var(--surface-soft);
    text-align: center;
    width: 40px;
  }
  .data-grid .add-col-cell button, .data-grid .add-row-btn {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  .data-grid .add-col-cell button:hover, .data-grid .add-row-btn:hover {
    color: var(--primary);
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  /* ===== Alert banner (for dashboard warnings) ===== */
  .alert-banner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: #F8E8E4;
    border: 1px solid #E8C5BD;
    border-left: 3px solid #B86658;
    border-radius: var(--radius);
    margin-bottom: 18px;
  }
  .alert-banner.warn {
    background: var(--accent-soft);
    border-color: #EFD3B8;
    border-left-color: var(--accent);
  }
  .alert-banner > svg { color: #8a3a2c; flex-shrink: 0; margin-top: 2px; }
  .alert-banner.warn > svg { color: #8a4a1f; }
  .alert-banner .body { flex: 1; font-size: 13px; }
  .alert-banner .body strong { display: block; margin-bottom: 2px; }
  .alert-banner button {
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .alert-banner button:hover { background: rgba(0,0,0,0.04); }

  /* ===== Filters ===== */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .filter-bar select, .filter-bar input {
    width: auto;
    min-width: 150px;
    padding: 6px 10px;
    font-size: 12.5px;
  }
  .filter-bar input[type="text"] { min-width: 220px; }

  /* ===== Empty state ===== */
  .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-soft);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.7; }
  .empty-state h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }
  .empty-state p { font-size: 13px; margin-bottom: 18px; }

  /* ===== Dashboard ===== */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    grid-column: span 3;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .stat-card .label {
    font-size: 11.5px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat-card .delta {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
  }
  .stat-card.col-6 { grid-column: span 6; }
  .stat-card.col-12 { grid-column: span 12; }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--success);
    border-radius: 3px;
    transition: width 300ms;
  }
  .progress-bar.primary > div { background: var(--primary); }
  .progress-bar.accent > div { background: var(--accent); }

  .donut {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 20px;
    align-items: center;
  }
  .donut-svg { width: 140px; height: 140px; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
  }
  .legend-swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .legend-label { flex: 1; color: var(--text-soft); }
  .legend-value { font-weight: 500; }

  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row {
    display: grid;
    grid-template-columns: 130px 1fr 40px;
    gap: 10px;
    align-items: center;
    font-size: 12.5px;
  }
  .bar-row .label { color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar {
    height: 16px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-row .bar > div {
    height: 100%;
    background: var(--primary);
    transition: width 300ms;
  }
  .bar-row .value { text-align: right; font-weight: 500; }

  .stat-card h3 {
    font-size: 13px;
    margin-bottom: 14px;
    color: var(--text);
  }

  /* ===== Project setup banner ===== */
  .project-setup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 16px;
    align-items: end;
  }
  .project-setup .form-group { margin: 0; }

  /* ===== Ordered list (drag-and-drop reorder) ===== */
  .ordered-list {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    min-height: 60px;
    padding: 4px;
    list-style: none;
    margin: 0;
  }
  .ordered-empty {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .ordered-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    transition: background 100ms;
  }
  .ordered-item:hover { background: var(--surface-soft); }
  .ordered-item.dragging { opacity: 0.4; }
  .ordered-item.drag-over {
    background: var(--primary-soft);
    box-shadow: inset 0 2px 0 var(--primary);
  }
  .drag-handle {
    color: var(--text-muted);
    cursor: grab;
    user-select: none;
    font-family: var(--font-mono);
    letter-spacing: -3px;
    font-size: 14px;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .drag-handle:active { cursor: grabbing; }
  .order-num {
    min-width: 24px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-soft);
    flex-shrink: 0;
  }
  .ordered-item .item-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ordered-item .item-meta {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .ordered-item .item-actions {
    display: flex;
    gap: 1px;
    flex-shrink: 0;
  }
  .ordered-item .item-actions button {
    width: 22px;
    height: 22px;
    border-radius: var(--radius-sm);
    display: grid;
    place-items: center;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1;
  }
  .ordered-item .item-actions button:hover:not(:disabled) {
    background: var(--surface);
    color: var(--text);
  }
  .ordered-item .item-actions button:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ===== File sync card ===== */
  .file-sync {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    transition: background 120ms, border-color 120ms;
  }
  .file-sync.connected {
    background: var(--success-soft);
    border-color: #BFD9CB;
  }
  .file-sync.pending {
    background: var(--warning-soft);
    border-color: #E8D4A0;
  }
  .file-sync-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .file-sync-name {
    font-weight: 500;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .file-sync-status {
    font-size: 10.5px;
    margin-top: 1px;
  }

  /* ===== Tooltip ===== */
  .tooltip {
    position: fixed;
    background: var(--text);
    color: var(--surface);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    max-width: 320px;
    box-shadow: var(--shadow-lg);
    pointer-events: none;
    z-index: 400;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 140ms, transform 140ms;
  }
  .tooltip.show {
    opacity: 1;
    transform: translateY(0);
  }
  .tooltip::after {
    content: '';
    position: absolute;
    left: var(--arrow-x, 50%);
    transform: translateX(-50%);
    border: 5px solid transparent;
  }
  .tooltip[data-arrow="bottom"]::after {
    bottom: -10px;
    border-top-color: var(--text);
  }
  .tooltip[data-arrow="top"]::after {
    top: -10px;
    border-bottom-color: var(--text);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: var(--surface);
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 300;
    transform: translateY(8px);
    opacity: 0;
    transition: opacity 200ms, transform 200ms;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ===== Print spec view ===== */
  @media print {
    .sidebar, .page-header .actions, .modal-backdrop { display: none !important; }
    main { padding: 0; }
  }

  /* ===== Multi-select picker ===== */
  .picker {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    max-height: 320px;
    overflow-y: auto;
    /* Scroll-shadow indicator: shows a soft fade at top/bottom when content overflows */
    background:
      linear-gradient(var(--surface) 30%, rgba(255,255,255,0)) center top,
      linear-gradient(rgba(255,255,255,0), var(--surface) 70%) center bottom,
      radial-gradient(farthest-side at 50% 0, rgba(0,0,0,0.10), rgba(0,0,0,0)) center top,
      radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,0.10), rgba(0,0,0,0)) center bottom;
    background-color: var(--surface);
    background-repeat: no-repeat;
    background-size: 100% 24px, 100% 24px, 100% 8px, 100% 8px;
    background-attachment: local, local, scroll, scroll;
  }
  .picker-empty {
    padding: 18px 12px;
    color: var(--text-muted);
    font-size: 12.5px;
    text-align: center;
    font-style: italic;
  }
  .picker-filter {
    display: flex;
    gap: 6px;
    align-items: stretch;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .picker-filter > input[type="text"],
  .picker-filter > select {
    height: 34px;
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font: inherit;
    font-size: 13px;
  }
  .picker-filter > input[type="text"] { flex: 1 1 200px; min-width: 160px; }
  .picker-filter > select { flex: 0 1 auto; max-width: 200px; }
  .picker-filter > button { flex-shrink: 0; padding: 6px 8px; }
  .block-picker-search-row {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .block-picker-search {
    width: 100%;
    height: 30px;
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  .block-picker-search:focus { border-color: var(--primary); }
  .picker-count {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .picker-item {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 13px;
  }
  .picker-item:last-child { border-bottom: none; }
  .picker-item:hover { background: var(--surface-soft); }
  .picker-item input { margin: 0; }
  .picker-item .meta { margin-left: auto; color: var(--text-muted); font-size: 11.5px; }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav-btn { white-space: nowrap; }
    .sidebar-footer { display: none; }
    .memphis-deco { display: none; }
    main { padding: 20px; }
    .stat-card { grid-column: span 6; }
    .stat-card.col-6, .stat-card.col-12 { grid-column: span 12; }
    .form-row { grid-template-columns: 1fr; }
    .form-row-3 { grid-template-columns: 1fr; }
  }

  /* ===== Session bar / auth UI ===== */
  .session-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    margin: 0 0 12px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 12px;
  }
  .session-bar .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-bar .who strong { color: var(--text); }
  .session-bar .who small { color: var(--text-muted); display: block; font-size: 10.5px; }
  .session-bar .logout {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-soft);
  }
  .session-bar .logout:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .admin-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    margin: 0 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);

/* ===== IndexedDB wrapper =====
   Single-store key/value. We keep one persisted handle for the current
   data ('state') and one for the optional file sync handle ('fileHandle').
*/
let _dbPromise = null;
function getDB() {
  if (!_dbPromise) {
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return _dbPromise;
}

  const db = await getDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbSet(key, val) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(key) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ===== File System Access (sync vers fichier disque) =====
   FileSystemFileHandle is structured-cloneable and can be persisted in
   IndexedDB. Permissions don't auto-restore: we re-query on each save
   and request silently — if the browser declines, we keep going on
   IndexedDB only.
*/
async function syncToFile() {
  if (!fileHandle) return false;
  try {
    let perm = await fileHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      perm = await fileHandle.requestPermission({ mode: 'readwrite' });
    }
    if (perm !== 'granted') return false;
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    return true;
  } catch (e) {
    console.warn('File sync error', e);
    return false;
  }
}

async function connectFile() {
  if (!HAS_FILE_API) { toast('Navigateur non compatible (Chrome/Edge requis)'); return; }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'qa-catalog.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    fileHandle = handle;
    await dbSet('fileHandle', handle);
    const ok = await syncToFile();
    toast(ok ? 'Fichier connecté · synchronisation auto' : 'Fichier connecté, mais écriture initiale échouée');
    updateFileBanner();
    updateStorageIndicator();
  } catch (e) {
    if (e.name !== 'AbortError') toast('Erreur: ' + e.message);
  }
}

async function loadFromFile() {
  if (!HAS_FILE_API) { toast('Navigateur non compatible (Chrome/Edge requis)'); return; }

    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],

async function disconnectFile() {
  fileHandle = null;

async function reconnectFile() {
  if (!fileHandle) return;

      toast('Reconnecté · synchronisé');

/* ===== Persistence ===== */
let _githubSha = null;        // sha du data.json distant (pour eviter conflits)
let _githubSyncTimer = null;  // debounce ecriture
let _githubSyncBusy = false;

function setSyncIndicator(state, text) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  el.className = 'sync-indicator ' + state;
  el.textContent = text;
  el.style.display = state === 'hidden' ? 'none' : '';
}

async function pushToGitHub() {
  if (_githubSyncBusy) { scheduleGithubSync(); return; }
  if (!window.QAGitHub || !QAGitHub.getPat()) {
    setSyncIndicator('warn', 'Mode local · PAT requis (Admin)');
    return;
  }
  _githubSyncBusy = true;
  setSyncIndicator('busy', 'Synchro GitHub…');
  try {
    // On garde users/role inchanges, on ne touche qu'a state.
    const remote = await QAGitHub.fetchData().catch(() => null);
    const doc = (remote && remote.data) || { users: [], state: {} };
    doc.state = state;
    doc.updatedAt = new Date().toISOString();
    doc.updatedBy = (QASession.username && QASession.username()) || 'unknown';
    const sha = await QAGitHub.saveData(doc, (remote && remote.sha) || _githubSha, `Update state by ${doc.updatedBy}`);
    _githubSha = sha;
    setSyncIndicator('ok', 'Synchronise sur GitHub');
  } catch (e) {
    console.warn('Push GitHub echoue', e);
    if (e.message === 'CONFLICT') {
      setSyncIndicator('err', 'Conflit · rechargez la page');
      toast('Conflit de sync : un autre utilisateur a ecrit. Rechargez.');
    } else {
      setSyncIndicator('err', 'Sync impossible · ' + e.message);
    }
  } finally {
    _githubSyncBusy = false;
  }
}

function scheduleGithubSync() {
  if (_githubSyncTimer) clearTimeout(_githubSyncTimer);
  _githubSyncTimer = setTimeout(pushToGitHub, 1500);
}

async function save() {
  try {
    await dbSet('state', state);
    if (fileHandle) {
      syncToFile().then(ok => { if (!ok) console.warn('File sync skipped (no permission)'); });
    }
    updateStorageIndicator();
    // Sync GitHub (debounced)
    scheduleGithubSync();
  } catch (e) {
    console.error('Save failed', e);
    toast('Erreur de sauvegarde');
  }
}

async function load() {
  try {
    // Fetch shared state from GitHub. If successful, it wins over local cache.
    let loadedFromGitHub = false;
    try {
      setSyncIndicator('busy', 'Chargement GitHub…');
      const remote = await QAGitHub.fetchData();
      if (remote && remote.data && remote.data.state) {
        state = Object.assign(state, remote.data.state);
        _githubSha = remote.sha;
        await dbSet('state', state);
        setSyncIndicator(remote.source === 'cache' ? 'warn' : 'ok',
          remote.source === 'cache' ? 'Cache local (hors ligne)' : 'Charge depuis GitHub');
        loadedFromGitHub = remote.source !== 'cache';
      } else {
        setSyncIndicator('warn', 'data.json incomplet');
      }
    } catch (e) {
      console.warn('Load GitHub echoue, fallback IndexedDB', e);
      setSyncIndicator('warn', 'Hors ligne · IndexedDB');
    }

    if (!loadedFromGitHub) {
      // One-shot migration from localStorage if a previous version was used
      const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
      if (legacy) {
        try {
          const parsed = JSON.parse(legacy);
          await dbSet('state', parsed);
          state = Object.assign(state, parsed);
          localStorage.removeItem(STORAGE_KEY_LEGACY);
          console.log('Migration localStorage → IndexedDB OK');
        } catch (e) {
          console.warn('Legacy migration failed', e);
        }
      } else {
        const stored = await dbGet('state');
        if (stored) state = Object.assign(state, stored);
      }
    }
    // Restore file handle (permission re-validated lazily on first save)
    const handle = await dbGet('fileHandle');
    if (handle) fileHandle = handle;
    // Migrate plans to items model (idempotent)
    state.testPlans = (state.testPlans || []).map(migratePlan);
    // Ensure anomalies array exists (older saves predate this feature)
    if (!Array.isArray(state.anomalies)) state.anomalies = [];
    // Migrate single state.project → state.projects array (idempotent)
    if (!Array.isArray(state.projects)) state.projects = [];
    if (state.project && (state.project.name || state.project.startDate || state.project.endDate)) {
      // Only migrate if no projects exist yet (avoid duplicates on re-runs)
      if (state.projects.length === 0) {
        state.projects.push({
          id: uid(),
          name: state.project.name || 'Projet (migré)',
          startDate: state.project.startDate || '',
          endDate: state.project.endDate || '',
          planIds: [],
        });
      }
    }
    delete state.project;
    // Ensure each project has a planIds array
    state.projects.forEach(p => { if (!Array.isArray(p.planIds)) p.planIds = []; });
    // Migrate plan.projectId → project.planIds (idempotent)
    state.testPlans.forEach(pl => {
      if (pl.projectId) {
        const proj = state.projects.find(p => p.id === pl.projectId);
        if (proj && !proj.planIds.includes(pl.id)) {
          proj.planIds.push(pl.id);
        }
        delete pl.projectId;
      }
    });
    // Ensure tester arrays exist (older saves predate this feature)
    if (!Array.isArray(state.testerLevels)) state.testerLevels = [];
    if (!Array.isArray(state.testers)) state.testers = [];
    // Ensure each level has an order (default to insertion order)
    state.testerLevels.forEach((lvl, i) => { if (typeof lvl.order !== 'number') lvl.order = i + 1; });
    // Ensure data tables exist
    if (!Array.isArray(state.dataTables)) state.dataTables = [];
    state.dataTables.forEach(t => {
      if (!Array.isArray(t.columns)) t.columns = [];
      if (!Array.isArray(t.rows)) t.rows = [];
    });
    // Ensure business divisions exist
    if (!Array.isArray(state.businessDivisions)) state.businessDivisions = [];
    // Migrate legacy single divisionId → divisionIds (array, 0-n)
    ['testCases', 'testSuites', 'testPlans', 'testers'].forEach(key => {
      if (Array.isArray(state[key])) {
        state[key].forEach(e => {
          if (!Array.isArray(e.divisionIds)) {
            e.divisionIds = e.divisionId ? [e.divisionId] : [];
          }
          delete e.divisionId;
        });
      }
    });
    // Ensure step blocks exist; default step.type to 'step' for existing data
    if (!Array.isArray(state.stepBlocks)) state.stepBlocks = [];
    state.stepBlocks.forEach(b => {
      if (!Array.isArray(b.steps)) b.steps = [];
      b.steps.forEach(s => { if (!s.type) s.type = 'step'; });
    });
    state.testCases.forEach(c => {
      (c.steps || []).forEach(s => { if (!s.type) s.type = 'step'; });
      if (!Array.isArray(c.jiraTickets)) c.jiraTickets = [];
    });
    // Backfill sortOrder so drag/move arrows have a stable basis
    state.testCases.forEach((c, i) => {
      if (typeof c.sortOrder !== 'number') c.sortOrder = i + 1;
    });
    // Settings (global config like Jira base URL)
    if (!state.settings || typeof state.settings !== 'object') state.settings = {};
    if (typeof state.settings.jiraBaseUrl !== 'string') state.settings.jiraBaseUrl = '';
    // Migrate: ensure toAutomate (decision flag) exists. If absent, mirror `automated`.
    state.testCases.forEach(c => {
      if (typeof c.toAutomate !== 'boolean') c.toAutomate = !!c.automated;
    });
  } catch (e) {
    console.warn('Load failed', e);
  }
}

async function updateStorageIndicator() {
  try {
    const fmt = (b) => {
      if (b == null) return '—';
      const mb = b / 1024 / 1024;
      if (mb >= 1024) return (mb / 1024).toFixed(1) + ' Go';
      if (mb >= 1) return mb.toFixed(1) + ' Mo';
      return Math.max(1, Math.round(b / 1024)) + ' Ko';
    };
    const fill = document.getElementById('storage-fill');
    const text = document.getElementById('storage-text');
    if (!fill || !text) return;
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      if (est.quota && est.usage != null) {
        const pct = Math.min(100, (est.usage / est.quota) * 100);
        fill.style.width = pct + '%';
        text.textContent = `${fmt(est.usage)} sur ${fmt(est.quota)}`;
        return;
      }
    }
    // Fallback: estimate from JSON size
    const size = JSON.stringify(state).length * 2;
    fill.style.width = '0%';
    text.textContent = fmt(size) + ' (estimé)';
  } catch (e) {
    console.warn('Storage estimate failed', e);
  }
}

/* ===== Utils ===== */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const escapeHtml = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const formatMin = (m) => {
  if (!m && m !== 0) return '—';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r ? h + ' h ' + r : h + ' h';
};
const sumBy = (arr, fn) => arr.reduce((a, x) => a + (fn(x) || 0), 0);

/* ===== Tooltip (delegated) =====
   Any element with [data-tip="..."] gets a styled tooltip on hover/focus.
*/
const tooltip = (() => {
  let el, currentTarget = null;
  function ensure() {
    if (!el) {
      el = document.createElement('div');
      el.className = 'tooltip';
      document.body.appendChild(el);
    }
    return el;
  }
  function show(target) {
    const text = target.dataset.tip;
    if (!text) return;
    const t = ensure();
    t.textContent = text;
    t.classList.add('show');
    // Measure after content set
    const r = target.getBoundingClientRect();
    const tw = t.offsetWidth;
    const th = t.offsetHeight;
    const margin = 8;
    let left = r.left + r.width / 2 - tw / 2;
    let top = r.top - th - 10;
    let arrow = 'bottom';
    if (top < margin) { top = r.bottom + 10; arrow = 'top'; }
    const clampedLeft = Math.max(margin, Math.min(window.innerWidth - tw - margin, left));
    const targetCenterX = r.left + r.width / 2;
    const arrowX = targetCenterX - clampedLeft;
    t.style.left = clampedLeft + 'px';
    t.style.top = top + 'px';
    t.style.setProperty('--arrow-x', arrowX + 'px');
    t.dataset.arrow = arrow;
  }
  function hide() {
    if (el) el.classList.remove('show');
    currentTarget = null;
  }
  document.addEventListener('mouseover', (e) => {
    const target = e.target.closest && e.target.closest('[data-tip]');
    if (target && target !== currentTarget) {
      currentTarget = target;
      show(target);
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (!currentTarget) return;
    const next = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-tip]') : null;
    if (next === currentTarget) return;
    hide();
  });
  document.addEventListener('focusin', (e) => {
    const target = e.target.closest && e.target.closest('[data-tip]');
    if (target) { currentTarget = target; show(target); }
  });
  document.addEventListener('focusout', () => hide());
  // Hide on scroll/resize to avoid stale positioning
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
  return { hide };
})();
const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ===== Folder logic =====
   - 1 environnement → dossier de cet environnement
   - 2+ environnements → dossier "Transverse"
   - flag isInterface → dossier "Interfaces" (prioritaire)
*/
function folderOf(tc) {
  if (tc.isInterface) return { id: '__interfaces', name: 'Interfaces', kind: 'interfaces' };
  if (tc.environmentIds.length >= 2) return { id: '__transverse', name: 'Transverse', kind: 'transverse' };
  if (tc.environmentIds.length === 1) {
    const env = state.environments.find(e => e.id === tc.environmentIds[0]);
    return { id: env ? env.id : '__none', name: env ? env.title : 'Sans environnement', kind: 'env' };
  }
  return { id: '__none', name: 'Sans environnement', kind: 'env' };
}

/* ===== Suite metadata =====
   Suites don't carry their own env/types/folder — everything is derived
   from the test cases they contain. Order is preserved (testCaseIds order).
*/
function suiteMetadata(suite) {
  const cases = (suite.testCaseIds || [])
    .map(id => state.testCases.find(c => c.id === id))
    .filter(Boolean);
  const envIds = [...new Set(cases.flatMap(c => c.environmentIds || []))];
  const types = [...new Set(cases.flatMap(c => c.types || []))];
  const ready = cases.filter(c => c.ready).length;
  const automated = cases.filter(c => c.automated).length;
  const time = cases.reduce((acc, c) => acc + (Number(c.estimatedTime) || 0), 0);
  let folder;
  if (envIds.length === 0) {
    folder = { id: '__empty', name: 'Vide', kind: 'env' };
  } else if (envIds.length === 1) {
    const env = state.environments.find(e => e.id === envIds[0]);
    folder = { id: envIds[0], name: env ? env.title : 'Environnement supprimé', kind: 'env' };
  } else {
    folder = { id: '__transverse', name: 'Transverse', kind: 'transverse' };
  }
  return { cases, envIds, types, ready, automated, time, folder };
}

function suiteDisplayTitle(suite) {
  const meta = suiteMetadata(suite);
  // Suffix only when a single env is shared by all cases — for transverse
  // the folder grouping/badge already conveys it
  if (meta.envIds.length === 1) return `${suite.title} — ${meta.folder.name}`;
  return suite.title;
}

/* ===== Plan data model =====
   New model: plan.items = [{type:'suite'|'case', id}, ...] — preserves
   ordered execution flow that mixes suites and individual cases.
   Old model (plan.suiteIds, plan.testCaseIds) is auto-migrated on load.
*/
function migratePlan(p) {
  if (p.items) return p;
  const items = [
    ...(p.suiteIds || []).map(id => ({ type: 'suite', id })),
    ...(p.testCaseIds || []).map(id => ({ type: 'case', id })),
  ];
  return { id: p.id, title: p.title, items };
}

/* Walk plan items in order, returning the cases.
   dedupe=true: each case appears once (for counts/metadata)
   dedupe=false: preserves duplicates if the user intentionally listed a
   case both directly and via a suite (for execution checklist)
*/
function collectPlanCases(plan, dedupe = true) {
  const cases = [];
  const seen = new Set();
  (plan.items || []).forEach(item => {
    if (item.type === 'suite') {
      const s = state.testSuites.find(x => x.id === item.id);
      if (!s) return;
      (s.testCaseIds || []).forEach(cid => {
        if (dedupe && seen.has(cid)) return;
        const c = state.testCases.find(x => x.id === cid);
        if (c) { cases.push(c); seen.add(cid); }
      });
    } else if (item.type === 'case') {
      if (dedupe && seen.has(item.id)) return;
      const c = state.testCases.find(x => x.id === item.id);
      if (c) { cases.push(c); seen.add(item.id); }
    }
  });
  return cases;
}

function planMetadata(plan) {
  const cases = collectPlanCases(plan, true);
  const envIds = [...new Set(cases.flatMap(c => c.environmentIds || []))];
  const types = [...new Set(cases.flatMap(c => c.types || []))];
  const ready = cases.filter(c => c.ready).length;
  const automated = cases.filter(c => c.automated).length;
  const time = cases.reduce((acc, c) => acc + (Number(c.estimatedTime) || 0), 0);
  const suiteCount = (plan.items || []).filter(i => i.type === 'suite').length;
  const directCount = (plan.items || []).filter(i => i.type === 'case').length;
  let folder;
  if (envIds.length === 0) {
    folder = { id: '__empty', name: 'Vide', kind: 'env' };
  } else if (envIds.length === 1) {
    const env = state.environments.find(e => e.id === envIds[0]);
    folder = { id: envIds[0], name: env ? env.title : 'Environnement supprimé', kind: 'env' };
  } else {
    folder = { id: '__transverse', name: 'Transverse', kind: 'transverse' };
  }
  return { cases, envIds, types, ready, automated, time, suiteCount, directCount, folder };
}

function planDisplayTitle(plan) {
  const meta = planMetadata(plan);
  if (meta.envIds.length === 1) return `${plan.title} — ${meta.folder.name}`;
  return plan.title;
}

  { id: 'testplans',    label: 'Plans',        icon: ICON.plan,      render: renderTestPlans    },
  { id: 'anomalies',    label: 'Anomalies',    icon: ICON.bug,       render: renderAnomalies    },

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t =>
    `<button class="nav-btn ${t.id === currentTab ? 'active' : ''}" data-tab="${t.id}">${t.icon}<span>${t.label}</span></button>`
  ).join('');
  nav.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
}
function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById('view-' + id);
  view.classList.add('active');
  TABS.find(t => t.id === id).render(view);
}

/* ===== Modal helpers ===== */
function openModal(title, bodyHtml, footerHtml, onMount) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-backdrop').classList.add('open');

}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');

}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {

   DASHBOARD
   ===================================================================== */
function renderDashboard(view) {
  const cases = state.testCases;
  const totalCases = cases.length;
  const readyCases = cases.filter(c => c.ready).length;
  const automatedCases = cases.filter(c => c.automated).length;
  const automatedReady = cases.filter(c => c.ready && c.automated).length;
  const autoBacklog = cases.filter(c => c.toAutomate && !c.automated).length;
  const autoBacklogTime = sumBy(cases.filter(c => c.toAutomate && !c.automated), c => Number(c.estimatedTime) || 0);

  const readyPct = totalCases ? Math.round((readyCases / totalCases) * 100) : 0;
  const automationPct = totalCases ? Math.round((automatedCases / totalCases) * 100) : 0;
  const totalTime = sumBy(cases, c => Number(c.estimatedTime) || 0);
  const readyTime = sumBy(cases.filter(c => c.ready), c => Number(c.estimatedTime) || 0);

  // Anomaly stats
  const anStats = anomalyStats();

  // Project campaigns — sorted by urgency
  const PHASE_ORDER = { upcoming: 0, active: 1, undated: 2, past: 3 };
  const campaigns = (state.projects || []).map(p => ({ p, s: projectStats(p) }));
  campaigns.sort((a, b) => {
    const pa = PHASE_ORDER[a.s.phase], pb = PHASE_ORDER[b.s.phase];
    if (pa !== pb) return pa - pb;
    if (a.s.phase === 'upcoming') return a.s.daysToStart - b.s.daysToStart;
    if (a.s.phase === 'active')   return a.s.remainingDays - b.s.remainingDays;
    if (a.s.phase === 'past')     return a.s.daysToEnd - b.s.daysToEnd;
    return a.p.name.localeCompare(b.p.name);
  });
  // Show only those that are "live" on the dashboard (upcoming + active + recently past <30d)
  const liveCampaigns = campaigns.filter(({ s }) =>
    s.phase === 'upcoming' || s.phase === 'active' ||
    (s.phase === 'past' && -s.daysToEnd <= 30) ||
    s.phase === 'undated'
  );
  const urgentCampaigns = campaigns.filter(({ s }) => s.urgency === 'high');

  // Distribution par dossier
  const folderCounts = {};
  cases.forEach(c => {
    const f = folderOf(c);
    folderCounts[f.name] = (folderCounts[f.name] || 0) + 1;
  });
  const folderEntries = Object.entries(folderCounts).sort((a, b) => b[1] - a[1]);
  const maxFolder = Math.max(1, ...folderEntries.map(e => e[1]));

  // Distribution par type
  const typeCounts = {};
  cases.forEach(c => (c.types || []).forEach(t => { typeCounts[t] = (typeCounts[t] || 0) + 1; }));
  const typeEntries = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);

  // Donut readiness

  view.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <div class="subtitle">Suivi du catalogue (${totalCases} cas · ${state.environments.length} env · ${state.testSuites.length} suite${state.testSuites.length !== 1 ? 's' : ''} · ${state.testPlans.length} plan${state.testPlans.length !== 1 ? 's' : ''} · ${(state.projects || []).length} projet${(state.projects || []).length !== 1 ? 's' : ''}) et des campagnes de tests en cours</div>
      </div>
      <div class="actions">
        <button class="btn" id="add-project-from-dash">${ICON.plus}<span>Nouveau projet</span></button>

    ${urgentCampaigns.length > 0 ? `

        ${ICON.alert}

    ${liveCampaigns.length > 0 ? `

        <div class="progress-bar accent"><div style="width:${automationPct}%; background:var(--accent);"></div></div>
      </div>

      <div class="stat-card">
        <div class="label">Effort total</div>
        <div class="value">${formatMin(totalTime)}</div>
        <div class="delta">Prêt: ${formatMin(readyTime)}</div>
      </div>

      <div class="stat-card" data-anomaly-card style="cursor:pointer;">
        <div class="label">Anomalies ouvertes</div>
        <div class="value" style="color:${anStats.open > 0 ? 'var(--accent)' : 'var(--text)'};">${anStats.open}<span style="font-size:14px;color:var(--text-muted);"> / ${anStats.total}</span></div>
        <div class="delta" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          ${anStats.criticalOpen > 0 ? `<span class="badge badge-danger" style="font-size:10.5px;padding:1px 6px;">${anStats.criticalOpen} critique${anStats.criticalOpen > 1 ? 's' : ''}</span>` : ''}
          ${anStats.orphans > 0 ? `<span class="badge badge-accent" style="font-size:10.5px;padding:1px 6px;">${anStats.orphans} sans cas lié</span>` : ''}
          ${anStats.criticalOpen === 0 && anStats.orphans === 0 ? `<span style="color:var(--success);">${anStats.total === 0 ? 'aucune anomalie' : 'tout est tracé'}</span>` : ''}
        </div>
      </div>

      <div class="stat-card col-6">
        <h3>Préparation des cas</h3>
        <div class="donut">
          ${donutSvg(donutData)}
          <div class="donut-legend">
            ${donutData.map(d => `
              <div class="legend-item">
                <span class="legend-swatch" style="background:${d.color}"></span>

        ${folderEntries.length === 0 ? '<p style="color:var(--text-muted);font-size:13px;">Aucun cas pour l\'instant.</p>' : `

function donutSvg(data) {
  const total = data.reduce((a, x) => a + x.value, 0) || 1;
  const r = 50, cx = 70, cy = 70, stroke = 18;
  const C = 2 * Math.PI * r;
  let offset = 0;
  let segments = '';
  data.forEach(d => {
    const len = (d.value / total) * C;
    if (len === 0) return;
    segments += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
    offset += len;
  });
  const pct = data[0] ? Math.round((data[0].value / total) * 100) : 0;
  return `
    <svg class="donut-svg" viewBox="0 0 140 140">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
      ${segments}
      <text x="${cx}" y="${cy + 2}" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="600" fill="var(--text)">${pct}%</text>
      <text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="10" fill="var(--text-soft)">prêts</text>
    </svg>
  `;
}
