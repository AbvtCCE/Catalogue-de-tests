let tcFilters = { search: '', envId: '', type: '', ready: '', automated: '', crud: '', minLevel: '', division: '', steps: '' };
let tcSelection = new Set(); // ids of selected cases for bulk edit

function renderTestCases(view) {
  // Always work with cases sorted by sortOrder (manual ordering)
  const cases = [...state.testCases].sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  const filtered = cases.filter(c => {
    if (tcFilters.search && !(c.title || '').toLowerCase().includes(tcFilters.search.toLowerCase())) return false;
    if (tcFilters.envId === '__transverse' && !(c.environmentIds.length >= 2 && !c.isInterface)) return false;
    if (tcFilters.envId === '__interfaces' && !c.isInterface) return false;
    if (tcFilters.envId && tcFilters.envId !== '__transverse' && tcFilters.envId !== '__interfaces' && !c.environmentIds.includes(tcFilters.envId)) return false;
    if (tcFilters.type && !(c.types || []).includes(tcFilters.type)) return false;
    if (tcFilters.ready === 'yes' && !c.ready) return false;
    if (tcFilters.ready === 'no' && c.ready) return false;
    if (tcFilters.automated === 'yes' && !c.automated) return false;
    if (tcFilters.automated === 'no' && c.automated) return false;
    if (tcFilters.automated === 'backlog' && !(c.toAutomate && !c.automated)) return false;
    if (tcFilters.automated === 'manual_only' && c.toAutomate) return false;
    if (tcFilters.crud === '__none' && c.crud) return false;
    if (tcFilters.crud && tcFilters.crud !== '__none' && c.crud !== tcFilters.crud) return false;
    if (tcFilters.minLevel === '__none' && c.minLevelId) return false;
    if (tcFilters.minLevel && tcFilters.minLevel !== '__none' && c.minLevelId !== tcFilters.minLevel) return false;
    if (tcFilters.division === '__none' && (c.divisionIds || []).length > 0) return false;
    if (tcFilters.division && tcFilters.division !== '__none' && !(c.divisionIds || []).includes(tcFilters.division)) return false;
    if (tcFilters.steps) {
      const expandedCount = expandSteps(c.steps).filter(s => (s.action || '').trim() || (s.expected || '').trim()).length;
      if (tcFilters.steps === 'empty' && expandedCount !== 0) return false;
      if (tcFilters.steps === 'thin' && expandedCount >= 3) return false;
      if (tcFilters.steps === 'ok' && expandedCount < 3) return false;
    }
    return true;
  });

  // Group by folder
  const groups = {};
  filtered.forEach(c => {
    const f = folderOf(c);
    if (!groups[f.id]) groups[f.id] = { folder: f, items: [] };
    groups[f.id].items.push(c);
  });
  // Sort: interfaces first, then transverse, then envs alpha
  const sortedGroups = Object.values(groups).sort((a, b) => {
    if (a.folder.kind === 'interfaces' && b.folder.kind !== 'interfaces') return -1;
    if (b.folder.kind === 'interfaces' && a.folder.kind !== 'interfaces') return 1;
    if (a.folder.kind === 'transverse' && b.folder.kind === 'env') return -1;
    if (b.folder.kind === 'transverse' && a.folder.kind === 'env') return 1;
    return a.folder.name.localeCompare(b.folder.name);
  });

  view.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Cas de tests</h1>
        <div class="subtitle">${cases.length} au total · ${cases.filter(c => c.ready).length} prêts · ${cases.filter(c => c.automated).length} automatisés · ${cases.filter(c => c.toAutomate && !c.automated).length} en backlog auto</div>
      </div>
      <div class="actions">
        <button class="btn" id="import-tc">${ICON.upload}<span>Importer CSV</span></button>
        <button class="btn btn-primary" id="add-tc">${ICON.plus}<span>Nouveau cas</span></button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="f-search" placeholder="Rechercher par titre…" value="${escapeHtml(tcFilters.search)}">
      <select id="f-env">
        <option value="">Tous les dossiers</option>
        <option value="__transverse" ${tcFilters.envId === '__transverse' ? 'selected' : ''}>Transverse</option>
        <option value="__interfaces" ${tcFilters.envId === '__interfaces' ? 'selected' : ''}>Interfaces</option>
        ${state.environments.map(e => `<option value="${e.id}" ${tcFilters.envId === e.id ? 'selected' : ''}>${escapeHtml(e.title)}</option>`).join('')}
      </select>
      <select id="f-type">
        <option value="">Tous les types</option>
        ${TEST_TYPES.map(t => `<option value="${t.id}" ${tcFilters.type === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
      </select>
      <select id="f-ready">
        <option value="">État (tous)</option>
        <option value="yes" ${tcFilters.ready === 'yes' ? 'selected' : ''}>Prêts</option>
        <option value="no" ${tcFilters.ready === 'no' ? 'selected' : ''}>À préparer</option>
      </select>
      <select id="f-auto">
        <option value="">Automatisation (tous)</option>
        <option value="yes" ${tcFilters.automated === 'yes' ? 'selected' : ''}>Automatisés</option>
        <option value="backlog" ${tcFilters.automated === 'backlog' ? 'selected' : ''}>À automatiser (backlog)</option>
        <option value="manual_only" ${tcFilters.automated === 'manual_only' ? 'selected' : ''}>Manuels uniquement</option>
        <option value="no" ${tcFilters.automated === 'no' ? 'selected' : ''}>Non automatisés</option>
      </select>
      <select id="f-steps">
        <option value="">Étapes (toutes)</option>
        <option value="empty" ${tcFilters.steps === 'empty' ? 'selected' : ''}>Sans étape</option>
        <option value="thin" ${tcFilters.steps === 'thin' ? 'selected' : ''}>Moins de 3 étapes</option>
        <option value="ok" ${tcFilters.steps === 'ok' ? 'selected' : ''}>3 étapes ou plus</option>
      </select>
      <select id="f-crud">
        <option value="">CRUD (tous)</option>
        ${CRUD_OPS.map(op => `<option value="${op.id}" ${tcFilters.crud === op.id ? 'selected' : ''}>${op.short} — ${escapeHtml(op.label)}</option>`).join('')}
        <option value="__none" ${tcFilters.crud === '__none' ? 'selected' : ''}>Sans CRUD</option>
      </select>
      ${(state.testerLevels || []).length > 0 ? `
        <select id="f-level">
          <option value="">Niveau requis (tous)</option>
          ${sortedLevels().map(l => `<option value="${l.id}" ${tcFilters.minLevel === l.id ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
          <option value="__none" ${tcFilters.minLevel === '__none' ? 'selected' : ''}>Sans niveau requis</option>
        </select>
      ` : ''}
      ${(state.businessDivisions || []).length > 0 ? `
        <select id="f-division">
          <option value="">Division métier (toutes)</option>
          ${(state.businessDivisions || []).map(d => `<option value="${d.id}" ${tcFilters.division === d.id ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}
          <option value="__none" ${tcFilters.division === '__none' ? 'selected' : ''}>Sans division</option>
        </select>
      ` : ''}
    </div>

    <div id="tc-bulk-bar" class="bulk-bar" style="display:${tcSelection.size > 0 ? 'flex' : 'none'};">
      <div class="bulk-info">
        <strong id="tc-bulk-count">${tcSelection.size}</strong> cas sélectionné${tcSelection.size > 1 ? 's' : ''}
      </div>
      <div class="bulk-actions">
        <button class="btn btn-sm" id="tc-select-filtered">Sélectionner tous les cas filtrés</button>
        <button class="btn btn-sm" id="tc-select-clear">Tout désélectionner</button>
        <button class="btn btn-sm btn-primary" id="tc-bulk-edit">${ICON.edit}<span>Modifier en masse…</span></button>
      </div>
    </div>

    ${cases.length === 0 ? emptyState('Aucun cas de test', 'Créez votre premier cas. Il sera classé automatiquement selon son ou ses environnements.') :
      filtered.length === 0 ? emptyState('Aucun résultat', 'Ajustez les filtres pour voir des cas.') :
      sortedGroups.map(g => `
        <div class="folder-section">
          <div class="folder-header ${g.folder.kind}">
            ${ICON.folder}
            <span>${escapeHtml(g.folder.name)}</span>
            <span class="count">${g.items.length}</span>
          </div>
          ${g.items.map((tc, i) => testCaseRow(tc, { isFirst: i === 0, isLast: i === g.items.length - 1 })).join('')}
        </div>
      `).join('')
    }
  `;

  document.getElementById('add-tc').onclick = () => openTestCaseModal();
  document.getElementById('import-tc').onclick = () => openCsvImportModal(view);
  document.getElementById('f-search').oninput = (e) => { tcFilters.search = e.target.value; renderTestCases(view); };
  document.getElementById('f-env').onchange = (e) => { tcFilters.envId = e.target.value; renderTestCases(view); };
  document.getElementById('f-type').onchange = (e) => { tcFilters.type = e.target.value; renderTestCases(view); };
  document.getElementById('f-ready').onchange = (e) => { tcFilters.ready = e.target.value; renderTestCases(view); };
  document.getElementById('f-auto').onchange = (e) => { tcFilters.automated = e.target.value; renderTestCases(view); };
  if (document.getElementById('f-steps')) {
    document.getElementById('f-steps').onchange = (e) => { tcFilters.steps = e.target.value; renderTestCases(view); };
  }
  document.getElementById('f-crud').onchange = (e) => { tcFilters.crud = e.target.value; renderTestCases(view); };
  if (document.getElementById('f-level')) {
    document.getElementById('f-level').onchange = (e) => { tcFilters.minLevel = e.target.value; renderTestCases(view); };
  }
  if (document.getElementById('f-division')) {
    document.getElementById('f-division').onchange = (e) => { tcFilters.division = e.target.value; renderTestCases(view); };
  }

  view.querySelectorAll('[data-edit-tc]').forEach(b => b.onclick = () => openTestCaseModal(b.dataset.editTc));
  view.querySelectorAll('[data-delete-tc]').forEach(b => b.onclick = () => {
    confirmDialog('Supprimer ce cas de test ? Il sera retiré des suites et plans.', () => {
      const id = b.dataset.deleteTc;
      state.testCases = state.testCases.filter(c => c.id !== id);
      state.testSuites.forEach(s => s.testCaseIds = s.testCaseIds.filter(x => x !== id));
      state.testPlans.forEach(p => p.testCaseIds = p.testCaseIds.filter(x => x !== id));
      save();
      renderTestCases(view);
      toast('Cas supprimé');
    });
  });
  // Reorder: swap sortOrder with the previous/next case in the same folder group.
  // We use the displayed (sorted) groups so movement matches what the user sees.
  function moveTc(id, dir) {
    const target = state.testCases.find(c => c.id === id);
    if (!target) return;
    // Find sibling case in the same folder of the catalog (by global sort order)
    const targetFolder = folderOf(target).id;
    const sortedAll = [...state.testCases].sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
    const sameFolder = sortedAll.filter(c => folderOf(c).id === targetFolder);
    const localIdx = sameFolder.findIndex(c => c.id === id);
    const swapWith = sameFolder[localIdx + dir];
    if (!swapWith) return;
    const tmp = target.sortOrder;
    target.sortOrder = swapWith.sortOrder;
    swapWith.sortOrder = tmp;
    save().catch(e => console.error('Save after reorder failed', e));
    renderTestCases(view);
  }
  view.querySelectorAll('[data-tc-up]').forEach(b => b.onclick = () => moveTc(b.dataset.tcUp, -1));
  view.querySelectorAll('[data-tc-down]').forEach(b => b.onclick = () => moveTc(b.dataset.tcDown, 1));

  // Bulk selection wiring
  view.querySelectorAll('[data-tc-select]').forEach(cb => cb.onclick = (e) => {
    e.stopPropagation();
    const id = cb.dataset.tcSelect;
    if (cb.checked) tcSelection.add(id); else tcSelection.delete(id);
    // Update row visual + bar without full re-render
    const row = cb.closest('.testcase-row');
    if (row) row.classList.toggle('selected', cb.checked);
    const bar = document.getElementById('tc-bulk-bar');
    const cnt = document.getElementById('tc-bulk-count');
    if (bar) bar.style.display = tcSelection.size > 0 ? 'flex' : 'none';
    if (cnt) cnt.textContent = String(tcSelection.size);
  });
  const selFilteredBtn = document.getElementById('tc-select-filtered');
  if (selFilteredBtn) selFilteredBtn.onclick = () => {
    filtered.forEach(c => tcSelection.add(c.id));
    renderTestCases(view);
  };
  const selClearBtn = document.getElementById('tc-select-clear');
  if (selClearBtn) selClearBtn.onclick = () => {
    tcSelection.clear();
    renderTestCases(view);
  };
  const bulkEditBtn = document.getElementById('tc-bulk-edit');
  if (bulkEditBtn) bulkEditBtn.onclick = () => openBulkEditModal(view);
  // Restore focus to search if user was typing
  const fs = document.getElementById('f-search');
  if (tcFilters.search) { fs.focus(); fs.setSelectionRange(fs.value.length, fs.value.length); }
}

/* Parse a single CSV line, respecting double-quoted fields with escaped quotes ("").
   Returns array of cells. Separator is ';' by default but auto-detect if needed. */
function parseCsvLine(line, sep) {
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === sep) { out.push(cur); cur = ''; }
      else { cur += ch; }
    }
  }
  out.push(cur);
  return out;
}

function parseCsv(text) {
  // Strip BOM, normalize newlines
  const cleaned = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // Auto-detect separator: ';' or ',' or '\t' (priority to ';' as user requested)
  const firstLine = cleaned.split('\n')[0] || '';
  let sep = ';';
  if (!firstLine.includes(';')) {
    if (firstLine.includes('\t')) sep = '\t';
    else if (firstLine.includes(',')) sep = ',';
  }
  const rows = [];
  // Manual line-by-line walker that respects quoted newlines
  let line = '';
  let inQuotes = false;
  for (let i = 0; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (ch === '"') {
      if (inQuotes && cleaned[i + 1] === '"') { line += '""'; i++; }
      else { inQuotes = !inQuotes; line += ch; }
    } else if (ch === '\n' && !inQuotes) {
      if (line.trim()) rows.push(parseCsvLine(line, sep));
      line = '';
    } else {
      line += ch;
    }
  }
  if (line.trim()) rows.push(parseCsvLine(line, sep));
  return { rows, separator: sep };
}

  // Hold the user's chosen defaults across phase transitions
  let defaults = null;

  function mountPhase1(body) {
    const fileInput = body.querySelector('#csv-file');
    const textarea = body.querySelector('#csv-text');
    if (fileInput) fileInput.onchange = () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { textarea.value = reader.result || ''; };
      reader.readAsText(f, 'UTF-8');
    };
    body.querySelectorAll('.check-pill').forEach(pill => {
      pill.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'INPUT') return;
        ev.preventDefault();
        const cb = pill.querySelector('input');
        cb.checked = !cb.checked;
        pill.classList.toggle('checked', cb.checked);
      });
    });

    document.getElementById('csv-preview').onclick = () => {
      const text = textarea.value || '';
      if (!text.trim()) { toast('Collez un CSV ou importez un fichier'); return; }
      const envIds = Array.from(body.querySelectorAll('#csv-envs input:checked')).map(i => i.value);
      if (state.environments.length > 0 && envIds.length === 0) { toast('Sélectionnez au moins un environnement'); return; }

      // Capture defaults
      defaults = {
        environmentIds: envIds,
        crud: body.querySelector('#csv-crud').value || null,
        minLevelId: body.querySelector('#csv-minlevel').value || null,
        estimatedTime: body.querySelector('#csv-time').value || '',
        divisionIds: Array.from(body.querySelectorAll('#csv-divisions input:checked') || []).map(i => i.value),
        types: Array.from(body.querySelector('#csv-types-helper').selectedOptions).map(o => o.value),
        ready: body.querySelector('#csv-ready').checked,
        toAutomate: body.querySelector('#csv-toauto').checked,
        isInterface: body.querySelector('#csv-interface').checked,
        dupMode: body.querySelector('#csv-dup-mode').value,
      };

      const parsed = parseCsv(text);
      detectedSep = parsed.separator;
      let rows = parsed.rows;
      // Detect header: first row looks like a header if cell 0 is non-Jira-like (no dash-digit pattern)
      if (rows.length > 0) {
        const c0 = (rows[0][0] || '').trim();
        const looksLikeKey = /^[A-Za-z][A-Za-z0-9]*-\d+$/.test(c0);
        const looksLikeHeader = !looksLikeKey && c0 && c0.toLowerCase().match(/^(key|jira|ticket|cl[eé])/);
        if (looksLikeHeader) rows = rows.slice(1);
      }
      parsedRows = rows;

      // Build import plan
      const seenKeys = new Set();
      const existingKeys = new Set();
      state.testCases.forEach(c => (c.jiraTickets || []).forEach(t => { if (t.key) existingKeys.add(t.key.toUpperCase()); }));

      importPlan = parsedRows.map(row => {
        const jiraKey = (row[0] || '').trim().toUpperCase();
        const title = (row[1] || '').trim();
        const item = { jiraKey, title, skip: false };
        if (!title) {
          item.skip = true;
          item.reason = 'titre manquant';
          return item;
        }
        if (jiraKey && existingKeys.has(jiraKey) && defaults.dupMode === 'skip') {
          item.skip = true;
          item.reason = 'clé Jira déjà liée';
          return item;
        }
        if (jiraKey && seenKeys.has(jiraKey) && defaults.dupMode === 'skip') {
          item.skip = true;
          item.reason = 'doublon dans le CSV';
          return item;
        }
        if (jiraKey) seenKeys.add(jiraKey);
        if (!jiraKey) item.warning = 'sans clé Jira';
        return item;
      });

      phase = 2;
      document.getElementById('modal-body').innerHTML = modalHtmlPhase2();
      document.getElementById('modal-footer').innerHTML = modalFooterPhase2();
      mountPhase2(document.getElementById('modal-body'));
    };
  }

  function mountPhase2(body) {
    body.querySelectorAll('[data-csv-include]').forEach(cb => {
      cb.onchange = () => {
        const i = +cb.dataset.csvInclude;
        importPlan[i].skip = !cb.checked;
        // Re-render only the footer count
        document.getElementById('modal-footer').innerHTML = modalFooterPhase2();
        wireFooter2();
      };
    });
    wireFooter2();
  }

  function wireFooter2() {
    const back = document.getElementById('csv-back');
    if (back) back.onclick = () => {
      phase = 1;
      document.getElementById('modal-body').innerHTML = modalHtmlPhase1();
      document.getElementById('modal-footer').innerHTML = modalFooterPhase1();
      // Restore textarea content
      const ta = document.getElementById('csv-text');
      if (ta) ta.value = parsedRows.map(r => r.join(detectedSep)).join('\n');
      // Restore defaults selections
      if (defaults) {
        defaults.environmentIds.forEach(id => {
          const cb = document.querySelector(`#csv-envs input[value="${id}"]`);
          if (cb) { cb.checked = true; cb.parentElement.classList.add('checked'); }
        });
        if (defaults.crud) document.getElementById('csv-crud').value = defaults.crud;
        if (defaults.minLevelId) document.getElementById('csv-minlevel').value = defaults.minLevelId;
        if (defaults.estimatedTime) document.getElementById('csv-time').value = defaults.estimatedTime;
        defaults.divisionIds.forEach(id => {
          const cb = document.querySelector(`#csv-divisions input[value="${id}"]`);
          if (cb) { cb.checked = true; cb.parentElement.classList.add('checked'); }
        });
        defaults.types.forEach(id => {
          const opt = document.querySelector(`#csv-types-helper option[value="${id}"]`);
          if (opt) opt.selected = true;
        });
        document.getElementById('csv-ready').checked = defaults.ready;
        document.getElementById('csv-toauto').checked = defaults.toAutomate;
        document.getElementById('csv-interface').checked = defaults.isInterface;
        document.getElementById('csv-dup-mode').value = defaults.dupMode;
      }
      mountPhase1(document.getElementById('modal-body'));
    };
    const commit = document.getElementById('csv-commit');
    if (commit) commit.onclick = () => {
      const toImport = importPlan.filter(p => !p.skip);
      if (toImport.length === 0) { toast('Rien à importer'); return; }
      const maxOrder = state.testCases.reduce((m, c) => Math.max(m, c.sortOrder || 0), 0);
      let added = 0;
      toImport.forEach((p, i) => {
        const tc = {
          id: uid(),
          title: p.title,
          environmentIds: [...defaults.environmentIds],
          isInterface: defaults.isInterface,
          steps: [{ type: 'step', action: '', expected: '', requiresScreenshot: false }],
          screenshots: [],
          ready: defaults.ready,
          automated: false,
          toAutomate: defaults.toAutomate,
          estimatedTime: defaults.estimatedTime || '',
          types: [...defaults.types],
          crud: defaults.crud,
          minLevelId: defaults.minLevelId,
          divisionIds: [...defaults.divisionIds],
          jiraTickets: p.jiraKey ? [{ key: p.jiraKey, summary: '' }] : [],
          sortOrder: maxOrder + i + 1,
        };
        state.testCases.push(tc);
        added++;
      });
      save();
      closeModal();
      renderTestCases(view);
      toast(`${added} cas importé${added > 1 ? 's' : ''}`);
    };
  }

  openModal('Importer des cas depuis un CSV', modalHtmlPhase1(), modalFooterPhase1(), (body) => {
    mountPhase1(body);
  });
}

    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="bulk-apply">Appliquer aux ${targets.length} cas</button>
  `, (body) => {
    // Wire toggles to enable/disable their inputs
    function wireToggle(togId, inputSel, blockId) {
      const tog = body.querySelector('#' + togId);
      tog.addEventListener('change', () => {
        if (inputSel) {
          const el = body.querySelector(inputSel);
          if (el) el.disabled = !tog.checked;
        }
        if (blockId) {
          const blk = body.querySelector('#' + blockId);
          if (blk) blk.style.display = tog.checked ? 'block' : 'none';
        }
      });
    }
    wireToggle('bf-ready', '#bv-ready');
    wireToggle('bf-toAutomate', '#bv-toAutomate');
    wireToggle('bf-automated', '#bv-automated');
    wireToggle('bf-crud', '#bv-crud');
    if (body.querySelector('#bf-minLevel')) wireToggle('bf-minLevel', '#bv-minLevel');
    wireToggle('bf-environments', null, 'bv-environments-block');
    wireToggle('bf-types', null, 'bv-types-block');
    if (body.querySelector('#bf-divisions')) wireToggle('bf-divisions', null, 'bv-divisions-block');

    // Wire pills click-to-toggle
    body.querySelectorAll('.bulk-multi .check-pill').forEach(pill => {
      pill.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'INPUT') return;
        ev.preventDefault();
        const cb = pill.querySelector('input');
        cb.checked = !cb.checked;
        pill.classList.toggle('checked', cb.checked);
      });
    });

    document.getElementById('bulk-apply').onclick = () => {
      const changes = [];
      // Collect single-value changes
      if (body.querySelector('#bf-ready').checked) {
        const v = body.querySelector('#bv-ready').value === 'true';
        changes.push(c => { c.ready = v; });
      }
      if (body.querySelector('#bf-toAutomate').checked) {
        const v = body.querySelector('#bv-toAutomate').value === 'true';
        changes.push(c => {
          c.toAutomate = v;
          if (!v && c.automated) c.automated = false; // consistency
        });
      }
      if (body.querySelector('#bf-automated').checked) {
        const v = body.querySelector('#bv-automated').value === 'true';
        changes.push(c => {
          c.automated = v;
          if (v) c.toAutomate = true; // consistency
        });
      }
      if (body.querySelector('#bf-crud').checked) {
        const v = body.querySelector('#bv-crud').value || null;
        changes.push(c => { c.crud = v; });
      }
      if (body.querySelector('#bf-minLevel') && body.querySelector('#bf-minLevel').checked) {
        const v = body.querySelector('#bv-minLevel').value || null;
        changes.push(c => { c.minLevelId = v; });
      }
      // Multi-select with mode
      function applyMulti(toggleId, modeName, selector, fieldKey) {
        const tog = body.querySelector('#' + toggleId);
        if (!tog || !tog.checked) return;
        const mode = body.querySelector(`input[name="${modeName}"]:checked`).value;
        const ids = Array.from(body.querySelectorAll(selector + ':checked')).map(i => i.value || i.dataset.bvEnv || i.dataset.bvType || i.dataset.bvDiv);
        // selector returns inputs with various data attrs, get the value attribute properly
        const realIds = Array.from(body.querySelectorAll(selector + ':checked')).map(i => {
          // input has a data attribute, we need the value of that attribute
          const attrs = i.attributes;
          for (let j = 0; j < attrs.length; j++) {
            if (attrs[j].name.startsWith('data-bv-')) return attrs[j].value;
          }
          return i.value;
        });
        changes.push(c => {
          if (!Array.isArray(c[fieldKey])) c[fieldKey] = [];
          if (mode === 'replace') {
            c[fieldKey] = [...realIds];
          } else if (mode === 'add') {
            const set = new Set(c[fieldKey]);
            realIds.forEach(id => set.add(id));
            c[fieldKey] = Array.from(set);
          } else if (mode === 'remove') {
            c[fieldKey] = c[fieldKey].filter(id => !realIds.includes(id));
          }
        });
      }
      applyMulti('bf-environments', 'bm-environments', '[data-bv-env]', 'environmentIds');
      applyMulti('bf-types', 'bm-types', '[data-bv-type]', 'types');
      if (body.querySelector('#bf-divisions')) {
        applyMulti('bf-divisions', 'bm-divisions', '[data-bv-div]', 'divisionIds');
      }

      if (changes.length === 0) {
        toast('Aucun champ activé');
        return;
      }

      // Apply
      const targets2 = state.testCases.filter(c => ids.includes(c.id));
      targets2.forEach(c => {
        changes.forEach(fn => fn(c));
        // Ensure required arrays exist
        if (!Array.isArray(c.environmentIds)) c.environmentIds = [];
        if (!Array.isArray(c.types)) c.types = [];
        if (!Array.isArray(c.divisionIds)) c.divisionIds = [];
      });

      save();
      closeModal();
      tcSelection.clear();
      renderTestCases(view);
      toast(`${targets2.length} cas modifié${targets2.length > 1 ? 's' : ''}`);
    };
  });
}

function testCaseRow(tc, opts) {
  opts = opts || {};
  const types = (tc.types || []).slice(0, 2).map(id => {
    const t = TEST_TYPES.find(x => x.id === id);
    return t ? `<span class="badge">${escapeHtml(t.label)}</span>` : '';
  }).join('');
  const moreTypes = (tc.types || []).length > 2 ? `<span class="badge">+${(tc.types || []).length - 2}</span>` : '';
  const crudOp = tc.crud ? CRUD_OPS.find(o => o.id === tc.crud) : null;
  const crudPill = crudOp
    ? `<span class="crud-pill ${tc.crud}" title="${escapeHtml(crudOp.label)}">${crudOp.short}</span>`
    : `<span class="crud-pill none" title="Aucune opération CRUD définie">—</span>`;
  const tcDivisions = (tc.divisionIds || []).map(did => (state.businessDivisions || []).find(d => d.id === did)).filter(Boolean);
  const divisionBadges = tcDivisions.map(d => `<span class="badge badge-accent" title="Division métier" style="font-size:11px;">${escapeHtml(d.name)}</span>`).join('');
  const jiraTickets = (tc.jiraTickets || []).filter(t => t.key);
  const jiraPills = jiraTickets.slice(0, 2).map(t => {
    const tooltip = t.summary || t.key;
    const url = jiraUrlFor(t.key);
    if (url) {
      return `<a class="jira-pill" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(tooltip)}" onclick="event.stopPropagation()">${escapeHtml(t.key)}<span class="ext-icon">${ICON.externalLink}</span></a>`;
    }
    return `<span class="jira-pill" title="${escapeHtml(tooltip)}">${escapeHtml(t.key)}</span>`;
  }).join('');
  const moreJira = jiraTickets.length > 2 ? `<span class="jira-pill" title="${escapeHtml(jiraTickets.slice(2).map(t => t.key + (t.summary ? ' — ' + t.summary : '')).join('\n'))}">+${jiraTickets.length - 2}</span>` : '';

  // Effective step count = expanded (block refs resolved) + non-empty
  const expanded = expandSteps(tc.steps).filter(s => (s.action || '').trim() || (s.expected || '').trim());
  const stepCount = expanded.length;
  // Count direct vs from-block steps for tooltip
  const directCount = expanded.filter(s => !s.fromBlock).length;
  const fromBlockCount = stepCount - directCount;
  const stepClass = stepCount === 0 ? 'empty' : (stepCount < 3 ? 'warn' : '');
  const stepTooltip = stepCount === 0
    ? 'Aucune étape — ce cas n\'est pas exécutable'
    : (fromBlockCount > 0
      ? `${stepCount} étape${stepCount > 1 ? 's' : ''} (${directCount} direct${directCount > 1 ? 'es' : 'e'} + ${fromBlockCount} via bloc${fromBlockCount > 1 ? 's' : ''})`
      : `${stepCount} étape${stepCount > 1 ? 's' : ''}`);

  return `
    <div class="testcase-row${tcSelection.has(tc.id) ? ' selected' : ''}">
      <input type="checkbox" class="testcase-select" data-tc-select="${tc.id}" ${tcSelection.has(tc.id) ? 'checked' : ''} title="Sélectionner pour l'édition de masse">
      <div class="testcase-status ${tc.ready ? 'ready' : ''}" title="${tc.ready ? 'Prêt' : 'À préparer'}"></div>
      ${crudPill}
      <div class="testcase-title" title="${escapeHtml(tc.title)}">${escapeHtml(tc.title || '(Sans titre)')}</div>
      <div class="testcase-meta">${jiraPills}${moreJira}${divisionBadges}${types}${moreTypes}</div>
      <div class="testcase-step-count ${stepClass}" title="${escapeHtml(stepTooltip)}">${ICON.list}<span>${stepCount} étape${stepCount > 1 ? 's' : ''}</span></div>
      <div class="testcase-meta">${tc.estimatedTime ? ICON.clock + ' ' + formatMin(tc.estimatedTime) : ''}</div>
      <div class="testcase-meta">${tc.automated
        ? '<span class="badge badge-accent">' + ICON.bot + ' Auto</span>'
        : (tc.toAutomate ? '<span class="badge" style="background:#FCE9D5;color:#8a4a1f;border-color:#EFD3B8;" title="Décidé d&#39;automatiser, pas encore implémenté">' + ICON.bot + ' À auto</span>' : '')
      }</div>
      <div class="testcase-meta">${(tc.screenshots || []).length ? '<span class="badge">' + ICON.image + ' ' + tc.screenshots.length + '</span>' : ''}</div>
      <div style="display:flex;gap:2px;">
        <button class="btn-icon btn-ghost" data-tc-up="${tc.id}" ${opts.isFirst ? 'disabled' : ''} title="Monter">↑</button>
        <button class="btn-icon btn-ghost" data-tc-down="${tc.id}" ${opts.isLast ? 'disabled' : ''} title="Descendre">↓</button>
        <button class="btn-icon btn-ghost" data-edit-tc="${tc.id}" title="Modifier">${ICON.edit}</button>
        <button class="btn-icon btn-ghost" data-delete-tc="${tc.id}" title="Supprimer">${ICON.trash}</button>
      </div>
    </div>
  `;
}

          ${state.environments.map(e => `

      <label class="switch" style="margin-top:8px;">
        <input type="checkbox" id="tc-interface" ${tc.isInterface ? 'checked' : ''}>
        <span class="switch-track"></span>
        <span style="font-size:13px;">Test d'interface (communication entre systèmes) → dossier Interfaces</span>
      </label>
      <label class="switch" style="margin-top:6px;" data-tip="Crée un cas distinct pour chaque environnement sélectionné, au lieu d'un seul cas transverse. Chaque copie hérite des étapes, captures, types et temps estimé. Le titre est suffixé du nom de l'environnement.">
        <input type="checkbox" id="tc-duplicate">
        <span class="switch-track"></span>
        <span style="font-size:13px;">Dupliquer en cas séparés <span class="hint">1 cas par environnement, au lieu de transverse</span></span>
      </label>
      <div id="tc-duplicate-hint" style="font-size:12px;color:var(--text-muted);margin-top:6px;min-height:16px;"></div>
    </div>

    <div class="form-group">
      <label class="field-label">Type de test <span class="hint">multi-sélection · survol pour la définition</span></label>
      <div class="check-group" id="tc-types">
        ${TEST_TYPES.map(t => `
          <label class="check-pill ${(tc.types || []).includes(t.id) ? 'checked' : ''}" data-tip="${escapeHtml(t.desc)}">
            <input type="checkbox" value="${t.id}" ${(tc.types || []).includes(t.id) ? 'checked' : ''}>
            <span>${t.label}</span>
          </label>
        `).join('')}

    <div class="form-group">
      <label class="field-label">Étapes</label>
      <div id="tc-var-toolbox"></div>
      <div class="steps-editor" id="tc-steps"></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button type="button" class="btn btn-sm" id="tc-add-step">${ICON.plus}<span>Ajouter une étape</span></button>
        <button type="button" class="btn btn-sm" id="tc-add-block">${ICON.layers}<span>Insérer un bloc</span></button>

    <div class="form-group">
      <label class="field-label">Captures d'écran <span class="hint">stockées localement, redimensionnées</span></label>
      <input type="file" id="tc-shot-input" accept="image/*" multiple style="display:none;">
      <div class="screenshots-grid" id="tc-shots"></div>
    </div>
  `, `
    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="tc-save">Enregistrer</button>
  `, (body) => {
    // Variable toolbox + steps with contenteditable rich editing
    let lastFocusedEditable = null;

    function refreshVarToolbox() {
      const tb = body.querySelector('#tc-var-toolbox');
      tb.innerHTML = renderVarToolboxHtml();
      tb.querySelectorAll('[data-insert-var]').forEach(btn => {
        btn.onclick = () => {
          if (!lastFocusedEditable) {
            toast('Cliquez d\'abord dans une étape pour positionner le curseur');
            return;
          }
          const ref = btn.dataset.insertVar;
          const [tableId, columnId] = ref.split('.');
          insertVarPill(lastFocusedEditable, tableId, columnId);
        };
      });
    }
    refreshVarToolbox();

    // Steps
    function renderSteps() {
      const c = body.querySelector('#tc-steps');
      const total = tc.steps.length;
      c.innerHTML = tc.steps.map((s, i) => {
        const upDisabled = i === 0 ? 'disabled' : '';
        const downDisabled = i === total - 1 ? 'disabled' : '';
        const reorderBtns = `
          <button type="button" class="btn-icon btn-ghost" data-step-up="${i}" ${upDisabled} title="Monter">↑</button>
          <button type="button" class="btn-icon btn-ghost" data-step-down="${i}" ${downDisabled} title="Descendre">↓</button>
        `;
        if (s.type === 'block') {
          const block = (state.stepBlocks || []).find(b => b.id === s.blockId);
          const stepCount = block ? (block.steps || []).length : 0;
          const label = block ? block.name : '(bloc supprimé)';
          const subtitle = block && stepCount > 0
            ? stepCount + ' étape' + (stepCount > 1 ? 's' : '') + ' · expansée' + (stepCount > 1 ? 's' : '') + ' à l\'exécution'
            : (block ? 'Aucune étape dans ce bloc' : 'Ce bloc n\'existe plus');
          return `
            <div class="step-row block-ref-row${block ? '' : ' missing'}">
              <div class="step-num">${i + 1}</div>
              <div class="block-ref-body">
                <div class="block-ref-name">${ICON.layers}<span>${escapeHtml(label)}</span></div>
                <div class="block-ref-sub">${escapeHtml(subtitle)}</div>
              </div>
              <div class="step-actions">
                ${reorderBtns}
                <button type="button" class="btn-icon btn-ghost" data-step-remove="${i}" title="Retirer">${ICON.close}</button>
              </div>
            </div>
          `;
        }
        return `
          <div class="step-row">
            <div class="step-num">${i + 1}</div>
            <div class="step-rich" contenteditable="true" data-step-action="${i}" data-placeholder="Action">${renderEditableContent(s.action || '')}</div>
            <div class="step-rich" contenteditable="true" data-step-expected="${i}" data-placeholder="Résultat attendu">${renderEditableContent(s.expected || '')}</div>
            <div class="step-actions">
              <button type="button" class="step-shot-toggle ${s.requiresScreenshot ? 'active' : ''}" data-step-shot="${i}" data-tip="Demander une capture d'écran au testeur sur cette étape lors de l'exécution" title="Capture requise">${ICON.image}</button>
              ${reorderBtns}
              <button type="button" class="btn-icon btn-ghost" data-step-remove="${i}" title="Retirer">${ICON.close}</button>
            </div>
          </div>
        `;
      }).join('');

      // Bind contenteditable inputs (action and expected)
      c.querySelectorAll('[data-step-action], [data-step-expected]').forEach(el => {
        const isAction = 'stepAction' in el.dataset;
        const idx = +(isAction ? el.dataset.stepAction : el.dataset.stepExpected);
        const key = isAction ? 'action' : 'expected';
        el.addEventListener('focus', () => { lastFocusedEditable = el; });
        el.addEventListener('mouseup', () => { lastFocusedEditable = el; });
        el.addEventListener('keyup', () => { lastFocusedEditable = el; });
        el.addEventListener('input', () => {
          tc.steps[idx][key] = serializeEditable(el);
        });
        el.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          document.execCommand('insertText', false, text);
        });
      });

      c.querySelectorAll('[data-step-shot]').forEach(b => b.onclick = () => {
        const i = +b.dataset.stepShot;
        tc.steps[i].requiresScreenshot = !tc.steps[i].requiresScreenshot;
        b.classList.toggle('active', tc.steps[i].requiresScreenshot);
      });
      c.querySelectorAll('[data-step-up]').forEach(b => b.onclick = () => {
        const i = +b.dataset.stepUp;
        if (i > 0) {
          [tc.steps[i - 1], tc.steps[i]] = [tc.steps[i], tc.steps[i - 1]];
          lastFocusedEditable = null;
          renderSteps();
        }
      });
      c.querySelectorAll('[data-step-down]').forEach(b => b.onclick = () => {
        const i = +b.dataset.stepDown;
        if (i < tc.steps.length - 1) {
          [tc.steps[i + 1], tc.steps[i]] = [tc.steps[i], tc.steps[i + 1]];
          lastFocusedEditable = null;
          renderSteps();
        }
      });
      c.querySelectorAll('[data-step-remove]').forEach(b => b.onclick = () => {
        tc.steps.splice(+b.dataset.stepRemove, 1);
        if (tc.steps.length === 0) tc.steps.push({ type: 'step', action: '', expected: '', requiresScreenshot: false });
        lastFocusedEditable = null;
        renderSteps();
      });
    }
    renderSteps();
    body.querySelector('#tc-add-step').onclick = () => {
      tc.steps.push({ type: 'step', action: '', expected: '', requiresScreenshot: false });
      renderSteps();
    };
    body.querySelector('#tc-add-block').onclick = (e) => {
      e.stopPropagation();
      showBlockPicker(e.currentTarget, (blockId) => {
        tc.steps.push({ type: 'block', blockId });
        renderSteps();
      });
    };

    // Pills toggle (envs + types) + live duplicate hint
    function updateDuplicateHint() {
      const dup = body.querySelector('#tc-duplicate').checked;
      const selectedEnvs = Array.from(body.querySelectorAll('#tc-envs input:checked'));
      const hint = body.querySelector('#tc-duplicate-hint');
      if (!dup) { hint.textContent = ''; return; }
      if (selectedEnvs.length < 2) {
        hint.textContent = 'Sélectionne au moins 2 environnements pour activer la duplication.';
        hint.style.color = 'var(--text-muted)';
        return;
      }
      const names = selectedEnvs.map(i => {
        const e = state.environments.find(x => x.id === i.value);
        return e ? e.title : '';
      }).filter(Boolean);
      hint.textContent = `→ Créera ${names.length} cas indépendants : ${names.map(n => '« ' + n + ' »').join(', ')}`;
      hint.style.color = 'var(--accent)';
    }
    body.querySelectorAll('.check-pill').forEach(pill => {
      pill.addEventListener('click', (ev) => {
        ev.preventDefault();
        const cb = pill.querySelector('input');
        cb.checked = !cb.checked;
        pill.classList.toggle('checked', cb.checked);
        updateDuplicateHint();
      });
    });
    body.querySelector('#tc-duplicate').addEventListener('change', updateDuplicateHint);
    updateDuplicateHint();

    // Live coupling: automated implies toAutomate; unchecking toAutomate also unchecks automated
    const toAutoEl = body.querySelector('#tc-toautomate');
    const autoEl = body.querySelector('#tc-automated');
    const autoHint = body.querySelector('#tc-auto-hint');
    function updateAutoHint() {
      const ta = toAutoEl.checked, a = autoEl.checked;
      if (a) autoHint.textContent = '';
      else if (ta) autoHint.textContent = 'Backlog d\'automatisation : décidé mais pas encore implémenté.';
      else autoHint.textContent = '';
    }
    autoEl.addEventListener('change', () => {
      if (autoEl.checked && !toAutoEl.checked) {
        toAutoEl.checked = true;
      }
      updateAutoHint();
    });
    toAutoEl.addEventListener('change', () => {
      if (!toAutoEl.checked && autoEl.checked) {
        autoEl.checked = false;
      }
      updateAutoHint();
    });
    updateAutoHint();

    // Jira tickets (with reorder)
    if (!Array.isArray(tc.jiraTickets)) tc.jiraTickets = [];
    function renderJira() {
      const c = body.querySelector('#tc-jira-list');
      const total = tc.jiraTickets.length;
      if (total === 0) {
        c.innerHTML = '<div style="font-size:12.5px;color:var(--text-muted);font-style:italic;padding:6px 0;">Aucun ticket lié. Cliquez sur « Ajouter un ticket » pour en lier un.</div>';
        return;
      }
      c.innerHTML = tc.jiraTickets.map((t, i) => `
        <div class="jira-row">
          <div class="jira-num">${i + 1}</div>
          <input type="text" class="jira-key" data-jira-key="${i}" value="${escapeHtml(t.key || '')}" placeholder="ABC-1234">
          <input type="text" data-jira-summary="${i}" value="${escapeHtml(t.summary || '')}" placeholder="Description courte">
          <div class="jira-actions">
            <button type="button" class="btn-icon btn-ghost" data-jira-up="${i}" ${i === 0 ? 'disabled' : ''} title="Monter">↑</button>
            <button type="button" class="btn-icon btn-ghost" data-jira-down="${i}" ${i === total - 1 ? 'disabled' : ''} title="Descendre">↓</button>
            <button type="button" class="btn-icon btn-ghost" data-jira-remove="${i}" title="Retirer">${ICON.close}</button>
          </div>
        </div>
      `).join('');

      c.querySelectorAll('[data-jira-key]').forEach(el => {
        el.addEventListener('input', e => {
          tc.jiraTickets[+el.dataset.jiraKey].key = e.target.value;
        });
      });
      c.querySelectorAll('[data-jira-summary]').forEach(el => {
        el.addEventListener('input', e => {
          tc.jiraTickets[+el.dataset.jiraSummary].summary = e.target.value;
        });
      });
      c.querySelectorAll('[data-jira-up]').forEach(b => b.onclick = () => {
        const i = +b.dataset.jiraUp;
        if (i > 0) {
          [tc.jiraTickets[i - 1], tc.jiraTickets[i]] = [tc.jiraTickets[i], tc.jiraTickets[i - 1]];
          renderJira();
        }
      });
      c.querySelectorAll('[data-jira-down]').forEach(b => b.onclick = () => {
        const i = +b.dataset.jiraDown;
        if (i < tc.jiraTickets.length - 1) {
          [tc.jiraTickets[i + 1], tc.jiraTickets[i]] = [tc.jiraTickets[i], tc.jiraTickets[i + 1]];
          renderJira();
        }
      });
      c.querySelectorAll('[data-jira-remove]').forEach(b => b.onclick = () => {
        tc.jiraTickets.splice(+b.dataset.jiraRemove, 1);
        renderJira();
      });
    }
    renderJira();
    body.querySelector('#tc-add-jira').onclick = () => {
      tc.jiraTickets.push({ key: '', summary: '', url: '' });
      renderJira();
      // Focus the new row's key input
      setTimeout(() => {
        const rows = body.querySelectorAll('[data-jira-key]');
        if (rows.length > 0) rows[rows.length - 1].focus();
      }, 0);
    };

    // Screenshots
    function renderShots() {
      const c = body.querySelector('#tc-shots');
      c.innerHTML = tc.screenshots.map((s, i) => `
        <div class="screenshot-thumb">
          <img src="${s.data}" alt="" data-shot-view="${i}">
          <button class="screenshot-remove" data-shot-remove="${i}" title="Retirer">${ICON.close}</button>
        </div>
      `).join('') + `
        <button type="button" class="screenshot-add" id="tc-shot-add">
          ${ICON.image}
          <span>Ajouter</span>
        </button>
      `;
      c.querySelectorAll('[data-shot-view]').forEach(img => img.onclick = () => openImageViewer(tc.screenshots[+img.dataset.shotView].data));
      c.querySelectorAll('[data-shot-remove]').forEach(b => b.onclick = (e) => { e.stopPropagation(); tc.screenshots.splice(+b.dataset.shotRemove, 1); renderShots(); });
      c.querySelector('#tc-shot-add').onclick = () => body.querySelector('#tc-shot-input').click();
    }
    renderShots();
    body.querySelector('#tc-shot-input').onchange = async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        try {
          const data = await compressImage(file);
          tc.screenshots.push({ name: file.name, data });
        } catch (err) { toast('Image illisible: ' + file.name); }
      }
      renderShots();
      e.target.value = '';
    };

    // Save
    body.parentElement.querySelector('#tc-save').onclick = () => {
      tc.title = body.querySelector('#tc-title').value.trim();
      if (!tc.title) { toast('Le titre est requis'); return; }
      tc.estimatedTime = body.querySelector('#tc-time').value ? Number(body.querySelector('#tc-time').value) : '';
      tc.ready = body.querySelector('#tc-ready').checked;
      tc.automated = body.querySelector('#tc-automated').checked;
      tc.toAutomate = body.querySelector('#tc-toautomate').checked;
      // Enforce: automated implies toAutomate (consistency)
      if (tc.automated) tc.toAutomate = true;
      tc.isInterface = body.querySelector('#tc-interface').checked;
      tc.environmentIds = Array.from(body.querySelectorAll('#tc-envs input:checked')).map(i => i.value);
      tc.types = Array.from(body.querySelectorAll('#tc-types input:checked')).map(i => i.value);
      tc.crud = body.querySelector('#tc-crud').value || null;
      tc.minLevelId = body.querySelector('#tc-minlevel').value || null;
      tc.divisionIds = Array.from(body.querySelectorAll('#tc-divisions input:checked')).map(i => i.value);
      tc.jiraTickets = (tc.jiraTickets || [])
        .map(t => ({
          key: (t.key || '').trim().toUpperCase(),
          summary: (t.summary || '').trim()
        }))
        .filter(t => t.key || t.summary);
      tc.steps = tc.steps.filter(s => s.type === 'block' || (s.action || '').trim() || (s.expected || '').trim());
      tc.steps.forEach(s => { if (!s.type) s.type = 'step'; });
      if (tc.steps.length === 0) tc.steps = [{ action: '', expected: '' }];

      const duplicate = body.querySelector('#tc-duplicate').checked;
      const maxOrder = state.testCases.reduce((m, c) => Math.max(m, c.sortOrder || 0), 0);

      if (duplicate && tc.environmentIds.length >= 2) {
        // Build N independent cases, one per environment
        const baseTitle = tc.title;
        const envIds = tc.environmentIds.slice();
        const copies = envIds.map((envId, i) => {
          const env = state.environments.find(e => e.id === envId);
          const copy = JSON.parse(JSON.stringify(tc));
          copy.environmentIds = [envId];
          copy.title = `${baseTitle} — ${env ? env.title : 'Env'}`;
          // Reuse original id for the first copy when editing, so suites/plans linkage stays intact
          copy.id = (i === 0 && id) ? id : uid();
          if (i > 0 || typeof copy.sortOrder !== 'number') copy.sortOrder = maxOrder + i + 1;
          return copy;
        });
        if (id) {
          const idx = state.testCases.findIndex(c => c.id === id);
          state.testCases[idx] = copies[0];
          state.testCases.push(...copies.slice(1));
        } else {
          state.testCases.push(...copies);
        }
        save();
        closeModal();
        switchTab('testcases');
        toast(`${copies.length} cas créés (un par environnement)`);
      } else {
        if (id) {
          const idx = state.testCases.findIndex(c => c.id === id);
          state.testCases[idx] = tc;
        } else {
          if (typeof tc.sortOrder !== 'number') tc.sortOrder = maxOrder + 1;
          state.testCases.push(tc);
        }
        save();
        closeModal();
        switchTab('testcases');
        toast(id ? 'Cas modifié' : 'Cas créé');
      }
    };
  });
}

/* ===== Image compression ===== */
function compressImage(file, maxW = 1200, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => { img.src = ev.target.result; };
    reader.onerror = () => reject();
    img.onload = () => {
      const ratio = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject();
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   SUITES DE TESTS
   ===================================================================== */
function renderTestSuites(view) {
  const suites = state.testSuites;

  // Group by derived folder
  const groups = {};
  suites.forEach(s => {
    const meta = suiteMetadata(s);
    const fId = meta.folder.id;
    if (!groups[fId]) groups[fId] = { folder: meta.folder, items: [] };
    groups[fId].items.push({ suite: s, meta });
  });
  const sortedGroups = Object.values(groups).sort((a, b) => {
    // Empty last, transverse before envs, envs alpha
    if (a.folder.id === '__empty' && b.folder.id !== '__empty') return 1;
    if (b.folder.id === '__empty' && a.folder.id !== '__empty') return -1;
    if (a.folder.kind === 'transverse' && b.folder.kind === 'env') return -1;
    if (b.folder.kind === 'transverse' && a.folder.kind === 'env') return 1;
    return a.folder.name.localeCompare(b.folder.name);
  });

  view.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Suites de tests</h1>
        <div class="subtitle">Catégorisation et environnement dérivés des cas. Glisser pour ordonner l'exécution.</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="add-suite">${ICON.plus}<span>Nouvelle suite</span></button>
      </div>
    </div>

    ${suites.length === 0 ? emptyState('Aucune suite', 'Créez votre première suite en sélectionnant un ensemble de cas de tests, dans l\'ordre d\'exécution souhaité.') :
      sortedGroups.map(g => `
        <div class="folder-section">
          <div class="folder-header ${g.folder.kind}">
            ${ICON.folder}
            <span>${escapeHtml(g.folder.name)}</span>
            <span class="count">${g.items.length}</span>
          </div>
          <div class="card-grid">
            ${g.items.map(({ suite, meta }) => `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                  <h3 style="font-size:15px;flex:1;">${escapeHtml(suiteDisplayTitle(suite))}</h3>
                  <div style="display:flex;gap:2px;flex-shrink:0;">
                    <button class="btn-icon btn-ghost" data-checklist-suite="${suite.id}" title="Générer une checklist testeur">${ICON.checklist}</button>
                    <button class="btn-icon btn-ghost" data-edit-suite="${suite.id}" title="Modifier">${ICON.edit}</button>
                    <button class="btn-icon btn-ghost" data-delete-suite="${suite.id}" title="Supprimer">${ICON.trash}</button>
                  </div>
                </div>
                <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
                  <span class="badge">${meta.cases.length} cas</span>
                  <span class="badge badge-success">${meta.ready} prêts</span>
                  ${meta.automated ? `<span class="badge badge-accent">${meta.automated} auto</span>` : ''}
                  ${meta.time ? `<span class="badge">${formatMin(meta.time)}</span>` : ''}
                  ${(() => {
                    const divs = (suite.divisionIds || []).map(did => (state.businessDivisions || []).find(d => d.id === did)).filter(Boolean);
                    return divs.map(d => `<span class="badge badge-accent">${ICON.briefcase} ${escapeHtml(d.name)}</span>`).join('');
                  })()}
                  ${meta.types.slice(0, 3).map(t => {
                    const lbl = (TEST_TYPES.find(x => x.id === t) || {}).label || t;
                    return `<span class="badge">${escapeHtml(lbl)}</span>`;
                  }).join('')}
                  ${meta.types.length > 3 ? `<span class="badge">+${meta.types.length - 3}</span>` : ''}
                </div>
                ${meta.cases.length > 0 ? `
                  <ol style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-soft);">
                    ${meta.cases.slice(0, 5).map((c, i) => `<li style="padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:var(--text-muted);margin-right:6px;">${i + 1}.</span>${escapeHtml(c.title)}</li>`).join('')}
                    ${meta.cases.length > 5 ? `<li style="padding:3px 0;color:var(--text-muted);">+ ${meta.cases.length - 5} autres</li>` : ''}
                  </ol>` : ''}
                ${renderLevelBreakdown(meta.cases)}
                ${renderDataTablesUsed(meta.cases)}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')
    }
  `;

  document.getElementById('add-suite').onclick = () => openTestSuiteModal();
  view.querySelectorAll('[data-checklist-suite]').forEach(b => b.onclick = () => openChecklistModal('suite', b.dataset.checklistSuite));
  view.querySelectorAll('[data-edit-suite]').forEach(b => b.onclick = () => openTestSuiteModal(b.dataset.editSuite));
  view.querySelectorAll('[data-delete-suite]').forEach(b => b.onclick = () => {
    const id = b.dataset.deleteSuite;
    confirmDialog('Supprimer cette suite ?', () => {
      try {
        const before = state.testSuites.length;
        state.testSuites = state.testSuites.filter(s => s.id !== id);
        state.testPlans.forEach(p => {
          p.items = (p.items || []).filter(it => !(it.type === 'suite' && it.id === id));
        });
        if (state.testSuites.length === before) {
          console.warn('Suite delete: no suite matched id', id);
          toast('Suite introuvable');
          return;
        }
        // Re-render BEFORE save so the user sees the change immediately even if save is slow.
        renderTestSuites(view);
        toast('Suite supprimée');
        save().catch(e => {
          console.error('Save after suite delete failed', e);
          toast('Erreur de sauvegarde — rechargez la page');
        });
      } catch (e) {
        console.error('Suite delete failed', e);
        toast('Erreur : ' + (e.message || 'suppression échouée'));
      }
    });
  });
}

function openTestSuiteModal(id) {
  const suite = id ? JSON.parse(JSON.stringify(state.testSuites.find(s => s.id === id))) : { id: uid(), title: '', testCaseIds: [] };
  let selectedIds = [...(suite.testCaseIds || [])];
  let dragId = null;

  function renderLists(body) {
    const selectedList = body.querySelector('#suite-selected');
    const availableList = body.querySelector('#suite-available');

    // Selected (in order)
    const selectedCases = selectedIds
      .map(cid => state.testCases.find(c => c.id === cid))
      .filter(Boolean);
    if (selectedCases.length === 0) {
      selectedList.innerHTML = '<li class="ordered-empty">Aucun cas sélectionné. Choisissez-en dans la liste ci-dessous.</li>';
    } else {
      selectedList.innerHTML = selectedCases.map((c, i) => {
        const f = folderOf(c);
        return `
          <li class="ordered-item" draggable="true" data-id="${c.id}">
            <span class="drag-handle" title="Glisser pour réordonner">⋮⋮</span>
            <span class="order-num">${i + 1}</span>
            <span class="item-title" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</span>
            <span class="item-meta">${escapeHtml(f.name)}</span>
            <div class="item-actions">
              <button data-move-up="${c.id}" ${i === 0 ? 'disabled' : ''} title="Monter">↑</button>
              <button data-move-down="${c.id}" ${i === selectedCases.length - 1 ? 'disabled' : ''} title="Descendre">↓</button>
              <button data-remove="${c.id}" title="Retirer">×</button>
            </div>
          </li>
        `;
      }).join('');
    }

    // Available (unselected, with optional filtering)
    const pfSearch = (body.querySelector('#suite-pf-search') || {}).value || '';
    const pfEnv = (body.querySelector('#suite-pf-env') || {}).value || '';
    const pfDivisionEl = body.querySelector('#suite-pf-division');
    const pfDivision = pfDivisionEl ? pfDivisionEl.value : '';
    const searchLower = pfSearch.toLowerCase();
    let availableCases = state.testCases.filter(c => !selectedIds.includes(c.id));
    const totalAvailable = availableCases.length;
    if (pfSearch) availableCases = availableCases.filter(c => (c.title || '').toLowerCase().includes(searchLower));
    if (pfEnv === '__transverse') availableCases = availableCases.filter(c => c.environmentIds.length >= 2 && !c.isInterface);
    else if (pfEnv === '__interfaces') availableCases = availableCases.filter(c => c.isInterface);
    else if (pfEnv) availableCases = availableCases.filter(c => c.environmentIds.includes(pfEnv));
    if (pfDivision === '__none') availableCases = availableCases.filter(c => (c.divisionIds || []).length === 0);
    else if (pfDivision) availableCases = availableCases.filter(c => (c.divisionIds || []).includes(pfDivision));

    if (state.testCases.length === 0) {
      availableList.innerHTML = '<div class="picker-empty">Aucun cas de test. Créez-en d\'abord dans l\'onglet Cas de tests.</div>';
    } else if (totalAvailable === 0) {
      availableList.innerHTML = '<div class="picker-empty">Tous les cas existants sont déjà inclus.</div>';
    } else if (availableCases.length === 0) {
      availableList.innerHTML = '<div class="picker-empty">Aucun cas ne correspond aux filtres.</div>';
    } else {
      availableList.innerHTML = availableCases.map(c => {
        const f = folderOf(c);
        return `
          <label class="picker-item">
            <input type="checkbox" data-add="${c.id}">
            <span>${escapeHtml(c.title)}</span>
            <span class="meta">${escapeHtml(f.name)}${c.ready ? ' · prêt' : ''}</span>
          </label>
        `;
      }).join('');
    }
    // Update counter
    const cntEl = body.querySelector('#suite-pf-count');
    if (cntEl) {
      const isFiltered = pfSearch || pfEnv || pfDivision;
      cntEl.textContent = isFiltered
        ? `${availableCases.length} / ${totalAvailable} cas affichés`
        : (totalAvailable > 0 ? `${totalAvailable} cas disponibles` : '');
    }

    // Wire actions
    body.querySelectorAll('[data-add]').forEach(cb => cb.onchange = (e) => {
      const cid = e.target.dataset.add;
      if (e.target.checked && !selectedIds.includes(cid)) selectedIds.push(cid);
      else selectedIds = selectedIds.filter(x => x !== cid);
      renderLists(body);
    });
    body.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
      selectedIds = selectedIds.filter(x => x !== b.dataset.remove);
      renderLists(body);
    });
    body.querySelectorAll('[data-move-up]').forEach(b => b.onclick = () => {
      const i = selectedIds.indexOf(b.dataset.moveUp);
      if (i > 0) {
        [selectedIds[i - 1], selectedIds[i]] = [selectedIds[i], selectedIds[i - 1]];
        renderLists(body);
      }
    });
    body.querySelectorAll('[data-move-down]').forEach(b => b.onclick = () => {
      const i = selectedIds.indexOf(b.dataset.moveDown);
      if (i >= 0 && i < selectedIds.length - 1) {
        [selectedIds[i + 1], selectedIds[i]] = [selectedIds[i], selectedIds[i + 1]];
        renderLists(body);
      }
    });

    // Drag and drop on selected list
    selectedList.querySelectorAll('[draggable]').forEach(item => {
      item.ondragstart = (e) => {
        dragId = item.dataset.id;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      };
      item.ondragend = () => {
        item.classList.remove('dragging');
        selectedList.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragId = null;
      };
      item.ondragover = (e) => {
        e.preventDefault();
        if (dragId && dragId !== item.dataset.id) item.classList.add('drag-over');
      };
      item.ondragleave = () => item.classList.remove('drag-over');
      item.ondrop = (e) => {
        e.preventDefault();
        if (!dragId || dragId === item.dataset.id) return;
        const fromIdx = selectedIds.indexOf(dragId);
        if (fromIdx < 0) return;
        const [moved] = selectedIds.splice(fromIdx, 1);
        const toIdx = selectedIds.indexOf(item.dataset.id);
        selectedIds.splice(toIdx, 0, moved);
        renderLists(body);
      };
    });

    // Live derived metadata preview
    const previewEl = body.querySelector('#suite-preview');
    if (previewEl) {
      const previewSuite = { ...suite, testCaseIds: selectedIds };
      const meta = suiteMetadata(previewSuite);
      const titleInput = body.querySelector('#suite-title');
      const baseTitle = (titleInput && titleInput.value.trim()) || suite.title || '(sans titre)';
      const displayed = meta.envIds.length === 1 ? `${baseTitle} — ${meta.folder.name}` : baseTitle;
      previewEl.innerHTML = selectedIds.length === 0 ? '<span style="color:var(--text-muted);font-size:12.5px;">Ajoutez des cas pour voir les métadonnées dérivées.</span>' : `
        <div style="font-size:12px;color:var(--text-muted);width:100%;">Affiché comme :</div>
        <div style="font-weight:500;font-size:13px;width:100%;margin-bottom:6px;">${escapeHtml(displayed)}</div>
        <span class="badge ${meta.folder.kind === 'transverse' ? 'badge-accent' : 'badge-primary'}">${escapeHtml(meta.folder.name)}</span>
        <span class="badge">${selectedIds.length} cas</span>
        <span class="badge badge-success">${meta.ready} prêts</span>
        ${meta.automated ? `<span class="badge badge-accent">${meta.automated} auto</span>` : ''}
        ${meta.time ? `<span class="badge">${formatMin(meta.time)}</span>` : ''}
        ${meta.types.map(t => {
          const lbl = (TEST_TYPES.find(x => x.id === t) || {}).label || t;
          return `<span class="badge">${escapeHtml(lbl)}</span>`;
        }).join('')}
      `;
    }
  }

  openModal(id ? 'Modifier la suite' : 'Nouvelle suite', `
    <div class="form-group">
      <label class="field-label">Titre <span class="required">*</span></label>
      <input type="text" id="suite-title" value="${escapeHtml(suite.title)}" placeholder="Ex. Smoke Tests">
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">Le nom de l'environnement est ajouté en suffixe automatiquement à l'affichage si tous les cas partagent le même.</div>
    </div>

    <div class="form-group">
      <label class="field-label">Divisions métier <span class="hint">${(state.businessDivisions || []).length === 0 ? 'pas de division définie' : 'multi-sélection · optionnel'}</span></label>
      ${(state.businessDivisions || []).length === 0
        ? '<p style="font-size:12.5px;color:var(--text-muted);margin:0;">Aucune division définie. Allez dans l\'onglet Testeurs pour en créer.</p>'
        : `<div class="check-group" id="suite-divisions">
            ${(state.businessDivisions || []).map(d => `
              <label class="check-pill ${(suite.divisionIds || []).includes(d.id) ? 'checked' : ''}">
                <input type="checkbox" value="${d.id}" ${(suite.divisionIds || []).includes(d.id) ? 'checked' : ''}>
                <span>${escapeHtml(d.name)}</span>
              </label>
            `).join('')}
          </div>`}
    </div>

    <div class="form-group">
      <label class="field-label">Métadonnées dérivées <span class="hint">recalculées en direct</span></label>
      <div id="suite-preview" style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:36px;align-items:center;"></div>
    </div>

    <div class="form-group">
      <label class="field-label">Cas inclus <span class="hint">glisser ⋮⋮ ou utiliser ↑↓ pour réordonner</span></label>
      <ul class="ordered-list" id="suite-selected"></ul>
    </div>

    <div class="form-group">
      <label class="field-label">Ajouter des cas</label>
      <div class="picker-filter">
        <input type="text" id="suite-pf-search" placeholder="Rechercher par titre…">
        <select id="suite-pf-env">
          <option value="">Tous les dossiers</option>
          <option value="__transverse">Transverse</option>
          <option value="__interfaces">Interfaces</option>
          ${state.environments.map(e => `<option value="${e.id}">${escapeHtml(e.title)}</option>`).join('')}
        </select>
        ${(state.businessDivisions || []).length > 0 ? `
          <select id="suite-pf-division">
            <option value="">Toutes divisions</option>
            ${(state.businessDivisions || []).map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}
            <option value="__none">Sans division</option>
          </select>
        ` : ''}
        <button type="button" class="btn btn-sm" id="suite-pf-clear" title="Effacer les filtres">${ICON.close}</button>
      </div>
      <div class="picker" id="suite-available"></div>
      <div class="picker-count" id="suite-pf-count"></div>
    </div>
  `, `
    <button class="btn" data-close-modal>Annuler</button>
    <button class="btn btn-primary" id="suite-save">Enregistrer</button>
  `, (body) => {
    renderLists(body);
    // Live preview update on title change
    body.querySelector('#suite-title').addEventListener('input', () => renderLists(body));

    // Picker filters
    const pfSearch = body.querySelector('#suite-pf-search');
    const pfEnv = body.querySelector('#suite-pf-env');
    const pfDiv = body.querySelector('#suite-pf-division');
    const pfClear = body.querySelector('#suite-pf-clear');
    if (pfSearch) pfSearch.addEventListener('input', () => renderLists(body));
    if (pfEnv) pfEnv.addEventListener('change', () => renderLists(body));
    if (pfDiv) pfDiv.addEventListener('change', () => renderLists(body));
    if (pfClear) pfClear.onclick = () => {
      if (pfSearch) pfSearch.value = '';
      if (pfEnv) pfEnv.value = '';
      if (pfDiv) pfDiv.value = '';
      renderLists(body);
    };

    // Wire division pills
    body.querySelectorAll('#suite-divisions .check-pill').forEach(pill => {
      pill.addEventListener('click', (ev) => {
        ev.preventDefault();
        const cb = pill.querySelector('input');
        cb.checked = !cb.checked;
        pill.classList.toggle('checked', cb.checked);
      });
    });

    document.getElementById('suite-save').onclick = () => {
      const title = body.querySelector('#suite-title').value.trim();
      if (!title) { toast('Le titre est requis'); return; }
      suite.title = title;
      suite.divisionIds = Array.from(body.querySelectorAll('#suite-divisions input:checked')).map(i => i.value);
      suite.testCaseIds = selectedIds;
      if (id) {
        const idx = state.testSuites.findIndex(s => s.id === id);
        state.testSuites[idx] = suite;
      } else {
        state.testSuites.push(suite);
      }
      save();
      closeModal();
      switchTab('testsuites');
      toast(id ? 'Suite modifiée' : 'Suite créée');
    };
  });
}
